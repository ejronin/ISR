name: Validate reader rearchitecture

on:
  pull_request:
    paths:
      - "src/public-reader-layer.js"
      - "src/public-reader-layer.css"
      - "js/public-app.js"
      - "js/public-bootstrap.js"
      - "index.html"
      - "templates/public-index.html"
      - "config/public-runtime-inventory.json"
      - "scripts/build_public_release.py"
      - "scripts/build_public_release_core.py"
      - "scripts/validate_public_deployment.py"
      - "scripts/sync_rook_narrative.py"
      - "config/rook-narrative-current.json"
      - "tests/public-reader-layer.test.js"
      - "tests/public-boot.test.js"
      - "tests/public-map-phase6.test.js"
      - "tests/browser-public-boot-smoke.js"
      - "tests/neutral-current-narrative.test.py"
      - "tests/public-final-polish.test.js"
      - "tests/browser-public-final-polish.js"
      - "tests/browser-public-render-review.js"
      - "docs/ENGINEERING_DOCTRINE.md"
      - "docs/PRIVILEGED_NARRATIVE_RETIREMENT_2026-09-10.md"
      - ".github/workflows/validate-reader-rearchitecture.yml"

permissions:
  contents: read

jobs:
  reader-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Reader-layer static and invariant checks
        run: |
          node --check src/public-reader-layer.js
          node --check js/public-app.js
          node --check js/public-bootstrap.js
          node --check tests/browser-public-boot-smoke.js
          node --check tests/browser-public-final-polish.js
          node --check tests/browser-public-render-review.js
          node tests/public-reader-layer.test.js
          node tests/public-final-polish.test.js
          python -m py_compile scripts/build_public_release.py scripts/build_public_release_core.py scripts/validate_public_deployment.py tests/neutral-current-narrative.test.py
          python tests/neutral-current-narrative.test.py
      - name: Verify reader assets and single-pass release core
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          js = root / 'src/public-reader-layer.js'
          css = root / 'src/public-reader-layer.css'
          app = root / 'js/public-app.js'
          assert js.is_file() and css.is_file() and app.is_file()
          js_text = js.read_text(encoding='utf-8')
          css_text = css.read_text(encoding='utf-8')
          app_text = app.read_text(encoding='utf-8')
          builder = (root / 'scripts/build_public_release.py').read_text(encoding='utf-8')
          core = (root / 'scripts/build_public_release_core.py').read_text(encoding='utf-8')
          bootstrap = (root / 'js/public-bootstrap.js').read_text(encoding='utf-8')
          inventory = (root / 'config/public-runtime-inventory.json').read_text(encoding='utf-8')

          assert 'ATLAS PUBLIC READER LAYER' in js_text
          assert 'ATLAS PUBLIC READER LAYER' in css_text
          assert 'display: none !important' not in css_text
          assert 'Combined ROOK assessment' not in js_text
          assert 'ROOK verdict / PR/CI evidence boundary' not in js_text

          for token in ('reader_runtime', 'reader_stylesheet', 'src/public-reader-layer.js', 'src/public-reader-layer.css'):
              assert token in core, token
              assert token in inventory, token
          assert core.count('(\"reader_runtime\", \"public-reader-layer\", \"src/public-reader-layer.js\", \"js\")') == 1
          assert core.count('(\"reader_stylesheet\", \"public-reader-layer\", \"src/public-reader-layer.css\", \"css\")') == 1
          assert '2.3-single-pass-reader-assets' in core
          assert 'from build_public_release_core import *' in builder
          for postprocess in ('_promote_reader_assets', '_rebind_release_identity', '_asset_set_sha256', 'READER_RUNTIME_SPEC', 'READER_STYLESHEET_SPEC', 'materialize_asset('):
              assert postprocess not in builder, postprocess

          assert 'reader_runtime' in bootstrap and 'reader_stylesheet' in bootstrap
          assert 'reader_runtime' in app_text and 'reader_stylesheet' in app_text
          assert 'authorization.runtimeAssets.length === 3' in app_text
          assert 'authorization.stylesheetAssets.length === 3' in app_text
          assert 'ROOK_NARRATIVE_CURRENT' not in app_text
          assert 'FINAL_NARRATIVE_GATES' not in app_text
          assert 'narrativeContract: null' in app_text

          for retired in (
              'compose_reader_sources',
              'ATLAS_PUBLIC_READER_LAYER_COMPOSED',
              'ATLAS_PUBLIC_READER_STYLES_COMPOSED',
              'PAGE_REGISTRY',
              'PUBLIC_STYLESHEET',
              'retire_privileged_narrative_runtime',
              'entrypoint_preparation',
          ):
              assert retired not in builder, retired

          assert not (root / 'config' / 'rook-narrative-current.json').exists()
          assert not (root / 'scripts' / 'sync_rook_narrative.py').exists()
          assert not (root / 'scripts' / 'retire_privileged_narrative_runtime.py').exists()
          PY
