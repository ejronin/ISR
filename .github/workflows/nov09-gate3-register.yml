name: One-time Gate3 registration of November 9 accepted evidence

on:
  push:
    branches: [evidence/accept-verified-nov09-20261109]
    paths:
      - .github/workflows/nov09-gate3-register.yml

permissions:
  contents: write

jobs:
  register:
    name: Register accepted packet using production Gate3 registrar
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install repository build requirements
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
          python -m pip check
      - name: Register reviewed and accepted packet transactionally
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/gate3_v2_registration.py --verify
          python scripts/gate3_v2_registration.py --register data/canonical-updates/UPD-20261109-SOURCE-QUALIFIED-CURRENT.json
          python scripts/gate3_v2_registration.py --verify
          python scripts/build_canonical_current_state_v2.py
          git diff --check
          git diff -- data/canonical-ledger/manifest-v2.json
      - name: Commit only registrar-produced manifest to candidate branch
        run: |
          set -euo pipefail
          git diff --name-only | grep -Fx 'data/canonical-ledger/manifest-v2.json'
          test "$(git diff --name-only | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/canonical-ledger/manifest-v2.json
          git commit -m 'Gate3: register Nov9 source-qualified packet via authoritative registrar'
          git push origin HEAD:refs/heads/evidence/accept-verified-nov09-20261109
