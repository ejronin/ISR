name: Apply Phase 10 browser timing labels

on:
  push:
    branches:
      - ux/phase10-language-presentation-20260906
    paths:
      - .github/workflows/phase10-browser-timing-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Update browser evidence timing contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/browser-public-evidence-phase5.js')
          text = p.read_text(encoding='utf-8')
          replacements = {
            "/Knowledge time2099-01-03/": "/Known at the time2099-01-03/",
            "/Later revision known2099-01-05T12:30:00-04:00/": "/Added later2099-01-05T12:30:00-04:00/",
            "/Event time/.test(node.textContent || '') && /Knowledge time/.test(node.textContent || '')": "/Event time/.test(node.textContent || '') && /Known at the time/.test(node.textContent || '')"
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one browser timing anchor for {old!r}, found {text.count(old)}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          node --check tests/browser-public-evidence-phase5.js
      - name: Commit browser timing contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-public-evidence-phase5.js
          git commit -m 'Update evidence timing browser contract for Phase 10'
          git push origin HEAD:ux/phase10-language-presentation-20260906
