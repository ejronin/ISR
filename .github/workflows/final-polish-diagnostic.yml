name: Final polish deterministic diagnostic

on:
  push:
    branches: [ux/final-polish-20260908]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/final-polish-20260908
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned build dependency
        run: python -m pip install --disable-pip-version-check --no-input 'Pillow==10.4.0'
      - name: Capture deterministic-chain failure
        shell: bash
        run: |
          set +e
          mkdir -p tools
          : > tools/_final-polish-diagnostic.log
          run_cmd() {
            echo ">>> $*" >> tools/_final-polish-diagnostic.log
            "$@" >> tools/_final-polish-diagnostic.log 2>&1
            rc=$?
            echo "<<< exit $rc" >> tools/_final-polish-diagnostic.log
            return $rc
          }
          run_cmd python scripts/build_canonical_current_state.py && \
          run_cmd python scripts/build_canonical_current_state.py --check && \
          run_cmd python scripts/validate_canonical_authority.py && \
          run_cmd python scripts/validate_canonical_update_pipeline.py && \
          run_cmd python tests/canonical-authority.test.py && \
          run_cmd python tests/canonical-update-pipeline.test.py && \
          run_cmd python scripts/build_public_current_state.py && \
          run_cmd python scripts/build_public_current_state.py --check && \
          run_cmd python scripts/validate_public_current_state.py && \
          run_cmd python scripts/build_canonical_current_state_v2_final.py --output data/canonical-current-state-v2.json && \
          run_cmd python scripts/validate_gate3_final.py && \
          run_cmd python tests/gate3-packet-hash-portability.test.py && \
          run_cmd python scripts/build_public_current_state_v2_hardened.py --output data/public-current-state.json && \
          run_cmd python scripts/build_canonical_current_state_v2_final.py --check --output data/canonical-current-state-v2.json && \
          run_cmd python scripts/build_public_current_state_v2_hardened.py --check --output data/public-current-state.json && \
          run_cmd python scripts/validate_public_current_state_v2.py && \
          run_cmd python scripts/build_public_release.py && \
          run_cmd python scripts/build_public_release.py --check && \
          run_cmd python scripts/validate_public_deployment.py && \
          run_cmd python scripts/validate_public_geography.py && \
          run_cmd python scripts/validate_public_runtime_inventory.py && \
          run_cmd python tests/public-runtime-inventory.test.py && \
          run_cmd python tests/public-release-evidence-image.test.py && \
          run_cmd python tests/public-release-state-flags.test.py && \
          run_cmd node tests/public-current-state.test.js && \
          run_cmd node tests/public-boot.test.js && \
          run_cmd node tests/public-ia.test.js && \
          run_cmd node tests/public-content-redesign.test.js && \
          run_cmd node tests/public-evidence-phase5.test.js && \
          run_cmd node tests/public-map-phase6.test.js && \
          run_cmd node tests/public-loss-actor-batch2.test.js && \
          run_cmd node tests/public-parity-batch3.test.js && \
          run_cmd node tests/public-phase9.test.js
          echo "diagnostic complete" >> tools/_final-polish-diagnostic.log
      - name: Commit diagnostic log
        run: |
          git add tools/_final-polish-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: capture final polish deterministic diagnostic'
          git push origin HEAD:ux/final-polish-20260908
