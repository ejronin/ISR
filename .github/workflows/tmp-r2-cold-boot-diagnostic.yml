name: Temporary R2 cold-boot diagnostic

on:
  push:
    branches:
      - release/r2-authoritative-reader-20260913
    paths:
      - .github/workflows/tmp-r2-cold-boot-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/r2-authoritative-reader-20260913
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Preserve coded registry failures through public boot
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('js/public-app.js')
          text = app.read_text()
          marker = """  async function boot(options) {\n"""
          helper = """  function normalizeBootError(error) {\n    if (error instanceof AtlasBootError) return error;\n    const code = error && typeof error.code === 'string' && error.code ? error.code : 'BOOT_FAILED';\n    return new AtlasBootError(code, 'The current evidence record could not be initialized.', error);\n  }\n\n  async function boot(options) {\n"""
          if text.count(marker) != 1:
              raise SystemExit('boot marker mismatch')
          text = text.replace(marker, helper, 1)
          old = "      const bootError = error instanceof AtlasBootError ? error : new AtlasBootError('BOOT_FAILED', 'The current evidence record could not be initialized.', error);"
          if text.count(old) != 1:
              raise SystemExit('boot error wrapper mismatch')
          text = text.replace(old, '      const bootError = normalizeBootError(error);', 1)
          export_marker = """    failureDetail,\n    renderFailure,\n"""
          if text.count(export_marker) != 1:
              raise SystemExit('export marker mismatch')
          text = text.replace(export_marker, """    failureDetail,\n    normalizeBootError,\n    renderFailure,\n""", 1)
          app.write_text(text)

          test = Path('tests/public-boot.test.js')
          body = test.read_text()
          test_marker = """  assert.match(app.failureDetail({ code: 'FETCH_FAILED' }), /unavailable|integrity/i);\n\n"""
          insertion = """  assert.match(app.failureDetail({ code: 'FETCH_FAILED' }), /unavailable|integrity/i);\n  const codedRegistryFailure = new Error('route guard rejected access');\n  codedRegistryFailure.code = 'UNDECLARED_DATA_DEPENDENCY';\n  const normalizedRegistryFailure = app.normalizeBootError(codedRegistryFailure);\n  assert.equal(normalizedRegistryFailure.code, 'UNDECLARED_DATA_DEPENDENCY', 'coded registry failures must survive public boot');\n  assert.equal(normalizedRegistryFailure.cause, codedRegistryFailure);\n  assert.equal(app.normalizeBootError(new Error('uncoded failure')).code, 'BOOT_FAILED', 'uncoded boot failures retain the generic boundary code');\n\n"""
          if body.count(test_marker) != 1:
              raise SystemExit('public boot test marker mismatch')
          test.write_text(body.replace(test_marker, insertion, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/public-app.js tests/public-boot.test.js
          git diff --cached --quiet && { echo 'No R2 boot repair produced'; exit 1; }
          git commit -m 'R2: preserve coded registry failures through boot'
          git push origin HEAD:release/r2-authoritative-reader-20260913
      - name: Install build requirements
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
          python -m pip check
      - name: Assemble current signed site
        run: |
          python scripts/build_source_registry.py --root .
          python scripts/build_current_release_state.py
          python scripts/build_public_release.py
          python scripts/assemble_public_site.py --output _site
          python scripts/write_build_info.py --output _site/build-info.json --commit "$(git rev-parse HEAD)"
          node tests/public-boot.test.js
      - name: Instrument cold-boot terminal state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/browser-public-boot-smoke.js')
          text = p.read_text()
          old = "    await waitFor(cdp, `window.ATLAS_PUBLIC_STATE?.status === 'ready'`);\n    const ready = await cdp.eval(`(() => ({"
          new = """    await waitFor(cdp, `['ready','error'].includes(window.ATLAS_PUBLIC_STATE?.status)`, 60000);\n    const terminal = await cdp.eval(`(() => ({ state: window.ATLAS_PUBLIC_STATE, rootStatus: document.getElementById('atlas-root')?.dataset.status, text: document.body.innerText }))()`);\n    console.log('COLD_BOOT_TERMINAL=' + JSON.stringify(terminal));\n    assert.equal(terminal.state?.status, 'ready', `cold boot did not reach ready: ${JSON.stringify(terminal)}`);\n    const ready = await cdp.eval(`(() => ({"""
          if text.count(old) != 1:
              raise SystemExit('expected cold-boot wait exactly once')
          p.write_text(text.replace(old, new, 1))
          runner = Path('scripts/run_public_browser_qualification.sh')
          body = runner.read_text()
          marker = 'node tests/browser-public-boot-smoke.js\n'
          if body.count(marker) != 1:
              raise SystemExit('expected browser smoke invocation exactly once')
          runner.write_text(body.replace(marker, marker + 'exit $?\n', 1))
          PY
      - name: Run cold-boot probe
        shell: bash
        run: |
          set +e
          bash scripts/run_public_browser_qualification.sh
          rc=$?
          set -e
          echo '--- CHROME LOG ---'
          cat /tmp/atlas-chrome.log || true
          echo '--- HTTP LOG ---'
          cat /tmp/atlas-http.log || true
          exit "$rc"
