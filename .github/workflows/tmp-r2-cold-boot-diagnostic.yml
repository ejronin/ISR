name: Temporary R2 cold-boot diagnostic

on:
  push:
    branches:
      - release/r2-authoritative-reader-20260913
    paths:
      - .github/workflows/tmp-r2-cold-boot-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/r2-authoritative-reader-20260913
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install build requirements
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
          python -m pip check
      - name: Instrument internal-leak predicate and cold-boot terminal state
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('src/public-reader-registry.js')
          source = registry.read_text()
          old = """    const exposedText = String(stage.innerText || stage.textContent || '');\n    invariant(!INTERNAL_TEXT.test(exposedText), 'READER_INTERNAL_LEAK', 'The staged route contains internal review text.');\n"""
          new = """    const exposedText = String(stage.innerText || stage.textContent || '');\n    const internalMatch = exposedText.match(INTERNAL_TEXT);\n    root.__ATLAS_READER_INTERNAL_MATCH = internalMatch ? {\n      match: internalMatch[0],\n      index: internalMatch.index,\n      context: exposedText.slice(Math.max(0, internalMatch.index - 100), internalMatch.index + internalMatch[0].length + 100)\n    } : null;\n    invariant(!internalMatch, 'READER_INTERNAL_LEAK', 'The staged route contains internal review text.');\n"""
          if source.count(old) != 1:
              raise SystemExit('internal leak predicate marker mismatch')
          registry.write_text(source.replace(old, new, 1))

          smoke = Path('tests/browser-public-boot-smoke.js')
          text = smoke.read_text()
          old_wait = "    await waitFor(cdp, `window.ATLAS_PUBLIC_STATE?.status === 'ready'`);\n    const ready = await cdp.eval(`(() => ({"
          new_wait = """    await waitFor(cdp, `['ready','error'].includes(window.ATLAS_PUBLIC_STATE?.status)`, 60000);\n    const terminal = await cdp.eval(`(() => ({ state: window.ATLAS_PUBLIC_STATE, rootStatus: document.getElementById('atlas-root')?.dataset.status, internalMatch: window.__ATLAS_READER_INTERNAL_MATCH, text: document.body.innerText }))()`);\n    console.log('COLD_BOOT_TERMINAL=' + JSON.stringify(terminal));\n    assert.equal(terminal.state?.status, 'ready', `cold boot did not reach ready: ${JSON.stringify(terminal)}`);\n    const ready = await cdp.eval(`(() => ({"""
          if text.count(old_wait) != 1:
              raise SystemExit('cold-boot wait marker mismatch')
          smoke.write_text(text.replace(old_wait, new_wait, 1))

          runner = Path('scripts/run_public_browser_qualification.sh')
          body = runner.read_text()
          marker = 'node tests/browser-public-boot-smoke.js\n'
          if body.count(marker) != 1:
              raise SystemExit('browser smoke invocation marker mismatch')
          runner.write_text(body.replace(marker, marker + 'exit $?\n', 1))
          PY
      - name: Assemble current signed site
        run: |
          python scripts/build_source_registry.py --root .
          python scripts/build_current_release_state.py
          python scripts/build_public_release.py
          python scripts/assemble_public_site.py --output _site
          python scripts/write_build_info.py --output _site/build-info.json --commit "$(git rev-parse HEAD)"
          node tests/public-boot.test.js
      - name: Run cold-boot probe
        shell: bash
        run: |
          set +e
          bash scripts/run_public_browser_qualification.sh
          rc=$?
          set -e
          echo '--- CHROME LOG ---'
          cat /tmp/atlas-chrome.log || true
          echo '--- HTTP LOG ---'
          cat /tmp/atlas-http.log || true
          exit "$rc"
