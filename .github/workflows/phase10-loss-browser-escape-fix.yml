name: Apply Phase 10 loss browser escape fix

on:
  push:
    branches:
      - ux/phase10-language-presentation-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/phase10-language-presentation-20260906
      - name: Repair CDP expression escaping
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/browser-public-loss-actor-batch2.js')
          text = path.read_text()
          old = ".map(node => node.innerText || '').join('\\n')"
          new = ".map(node => node.innerText || '').join('\\\\n')"
          if old not in text:
              raise SystemExit('CDP visualization join expression not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Verify browser test syntax
        run: node --check tests/browser-public-loss-actor-batch2.js
      - name: Commit escape repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-public-loss-actor-batch2.js
          git commit -m 'Fix Phase 10 loss browser CDP escaping'
          git push origin HEAD:ux/phase10-language-presentation-20260906
