name: Final polish Start Here route-contract repair

on:
  push:
    branches: [ux/final-polish-20260908]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/final-polish-20260908
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply production route-contract repair
        run: python tools/_final_polish_start_route_fix.py
      - name: Verify targeted contracts
        run: |
          node --check js/public-ia.js
          node tests/public-final-polish.test.js
          git diff --check
      - name: Commit durable repair and remove diagnostics
        run: |
          rm -f tools/_final_polish_start_route_fix.py
          rm -f .github/workflows/final-polish-start-route-fix.yml
          rm -f .github/workflows/final-polish-boot-diagnostic-v2.yml
          git add js/public-ia.js tests/public-final-polish.test.js tools/_final_polish_start_route_fix.py .github/workflows/final-polish-start-route-fix.yml .github/workflows/final-polish-boot-diagnostic-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: declare Start Here current-state dependencies'
          git push origin HEAD:ux/final-polish-20260908
