name: Validate public evidence atlas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install pinned build-time image decoder
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Regenerate and validate pinned Natural Earth reference geography
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/build_reference_geography.py --fetch-source-dir "$RUNNER_TEMP/atlas-natural-earth-v5.1.1" --check
          python scripts/validate_public_geography.py
      - name: Protect immutable migration authority and append-only ledger history
        env:
          AUTHORITY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_canonical_authority.py --compare-ref "$AUTHORITY_BASE_REF"
      - name: Build exhaustive source registry
        run: python scripts/build_source_registry.py --root .
      - name: Validate deterministic public current-state assembly
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/build_canonical_current_state.py
          python scripts/build_canonical_current_state.py --check
          python scripts/validate_canonical_authority.py
          python scripts/validate_canonical_update_pipeline.py
          python tests/canonical-authority.test.py
          python tests/canonical-update-pipeline.test.py
          python scripts/build_public_current_state.py
          python scripts/build_public_current_state.py --check
          python scripts/validate_public_current_state.py
          python scripts/build_public_release.py
          python scripts/build_public_release.py --check
          python scripts/validate_public_deployment.py
          python scripts/validate_public_geography.py
          python scripts/validate_public_runtime_inventory.py
          python tests/public-runtime-inventory.test.py
          python tests/public-release-evidence-image.test.py
          python tests/public-release-state-flags.test.py
          node tests/public-current-state.test.js
          node tests/public-boot.test.js
          node tests/public-ia.test.js
          node tests/public-content-redesign.test.js
          node tests/public-evidence-phase5.test.js
          node tests/public-map-phase6.test.js
          node tests/public-loss-actor-batch2.test.js
          node tests/public-parity-batch3.test.js
          node --check js/public-bootstrap.js
          node --check js/public-app.js
          node --check js/public-ia.js
          node --check tests/browser-public-boot-smoke.js
          node --check tests/browser-public-ia-smoke.js
          node --check tests/browser-public-evidence-phase5.js
          node --check tests/browser-public-map-phase6.js
          node --check tests/browser-public-loss-actor-batch2.js
          node --check tests/browser-public-parity-batch3.js
          python scripts/assemble_public_site.py --output _site
          python scripts/write_build_info.py --output _site/build-info.json --commit "$GITHUB_SHA"
          python scripts/assemble_public_site.py --output _site --check --require-build-info
          python scripts/validate_public_runtime_inventory.py --site-root _site --require-build-info
          python scripts/validate_public_deployment.py --site-root _site --require-build-info
      - name: Validate Aug. 24 count synchronization after source build
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_aug24_counts.py
      - name: Validate current and late-update overlays
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/validate_aug25_late.py
          python scripts/validate_aug26_strike_map.py
          python scripts/validate_aug27_update.py
          node --check js/current-update-20260827.js
          node --check js/iran-messaging-shifts-20260827-r1.js
          node --check tests/browser-aug27-messaging-smoke.js
      - name: Validate regional reconciliation coverage, evidence and ship-loss rules
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/validate_wiki_reconciliation.py
          python scripts/validate_build_info_current.py
          node --check js/wiki-map-reconciliation-20260826.js
          node --check js/current-update-20260826.js
          node --check js/app.js
      - name: Validate MOU logic and canonical strike integration
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/validate_mou_strike_integration_r1.py
          node --check js/iran-messaging-r1.js
          node --check tests/browser-mou-strike-smoke.js
      - name: Exercise cold, current, failure and release-mismatch boot paths in headless browser
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/atlas-http.log 2>&1 &
          server_pid=$!
          browser_pid=''
          process_is_running(){
            local pid="$1"
            local state=''
            kill -0 "$pid" 2>/dev/null || return 1
            if [ -r "/proc/$pid/stat" ]; then
              state="$(sed -E 's/^.*\) ([A-Z]) .*/\1/' "/proc/$pid/stat" 2>/dev/null)" || true
              [ "$state" != 'Z' ]
              return
            fi
            return 0
          }
          terminate_process(){
            local pid="${1:-}"
            local label="${2:-process}"
            local deadline
            [ -n "$pid" ] || return 0
            if process_is_running "$pid"; then
              echo "Stopping $label (pid $pid) with TERM." >&2
              kill -TERM "$pid" 2>/dev/null || true
              deadline=$((SECONDS + 5))
              while process_is_running "$pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.1
              done
            fi
            if process_is_running "$pid"; then
              echo "$label (pid $pid) did not exit after TERM; sending KILL." >&2
              kill -KILL "$pid" 2>/dev/null || true
              deadline=$((SECONDS + 2))
              while process_is_running "$pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.1
              done
            fi
            if process_is_running "$pid"; then
              echo "WARN: $label (pid $pid) is still present after KILL." >&2
              return 1
            fi
          }
          cleanup(){
            terminate_process "$browser_pid" 'browser' || true
            terminate_process "$server_pid" 'HTTP server' || true
          }
          trap cleanup EXIT
          mapfile -t browsers < <(
            for name in chromium google-chrome-stable google-chrome chromium-browser; do
              command -v "$name" 2>/dev/null || true
            done | awk '!seen[$0]++'
          )
          if [ "${#browsers[@]}" -eq 0 ]; then
            echo 'FAIL: no Chrome/Chromium executable is available for the public UI smoke test.' >&2
            exit 1
          fi
          ready=0
          browser=''
          for candidate in "${browsers[@]}"; do
            echo "Browser candidate: $candidate"
            timeout --signal=KILL 5s "$candidate" --version || true
            rm -rf /tmp/atlas-chrome-profile
            : >/tmp/atlas-chrome.log
            "$candidate" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --no-default-browser-check \
              --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
              --remote-allow-origins='*' --user-data-dir=/tmp/atlas-chrome-profile \
              'http://127.0.0.1:8765/?view=strikes' >/tmp/atlas-chrome.log 2>&1 &
            browser_pid=$!
            deadline=$((SECONDS + 15))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if curl -fsS --connect-timeout 1 --max-time 1 \
                http://127.0.0.1:9222/json/version >/tmp/atlas-cdp-version.json 2>/dev/null; then
                ready=1
                browser="$candidate"
                break
              fi
              if ! kill -0 "$browser_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            if [ "$ready" -eq 1 ]; then break; fi
            if process_is_running "$browser_pid"; then
              candidate_status='still running without CDP'
            else
              candidate_status='exited before exposing CDP'
            fi
            terminate_process "$browser_pid" "browser candidate $candidate" || true
            echo "Browser candidate failed ($candidate_status): $candidate" >&2
            cat /tmp/atlas-chrome.log >&2 || true
            browser_pid=''
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/atlas-http.log >&2 || true
            echo 'FAIL: no installed Chrome/Chromium candidate exposed a DevTools endpoint.' >&2
            exit 1
          fi
          echo "Selected browser path: $browser"
          timeout --signal=KILL 5s "$browser" --version || true
          cat /tmp/atlas-cdp-version.json
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-boot-smoke.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-ia-smoke.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-evidence-phase5.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-map-phase6.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-parity-batch3.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-loss-actor-batch2.js
      - name: Validate static atlas
        run: python scripts/validate.py
      - name: Validate historical-ledger integration
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_integration.py
      - name: Validate UX and security release gates
        run: python scripts/validate_ux.py
      - name: Scan tracked files and Git metadata for privacy regressions
        run: python scripts/privacy_scan.py
      - name: Run deterministic presentation, temporal, costing, hostile-input, and public-IA tests
        run: |
          node tests/presentation.test.js
          node tests/temporal-state.test.js
          node tests/security-rendering.test.js
          node tests/costing.test.js
          node tests/forensic-v1.3.2.test.js
          node tests/full-scope-20260822.test.js
          node tests/aug22-update.test.js
          node tests/endgame-page.test.js
          node tests/public-ux-20260823.test.js
          node tests/public-record-ia-20260826.test.js
          node tests/aug24-current-update.test.js
          node tests/ui-endgame-mermaid-r1.test.js
      - name: Validate ENDGAME analytical page
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_endgame_page.py
      - name: Validate compact shell, Mermaid adjudication and source context
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_ui_endgame_mermaid_r1.py
      - name: Validate ENDGAME / MOU / Public View R1
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_endgame_public_view_r1.py
      - name: Validate ENDGAME plain-language UX R1
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/endgame-ux-plain-language-r1.js
          python scripts/validate_endgame_ux_plain_language_r1.py
      - name: Validate public historical-record UX R2
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/public-record-ui-r2.js
          node --check js/navigation.js
          node --check js/state.js
          python scripts/validate_workspace_ux_plain_language_r1.py
      - name: Validate site-wide status, actor identity and government-source marker R1
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/status-identity-r1.js
          node --check js/source-bias-r1.js
          python scripts/validate_status_identity_r1.py
      - name: Validate popup, source and analysis legibility R3
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/site-legibility-r3.js
          python scripts/validate_site_legibility_r3.py
      - name: Validate final Mermaid fit and Oil Routes R1
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/final-mermaid-oil-routes-r1.js
          python scripts/validate_final_mermaid_oil_routes_r1.py
      - name: Validate Endgame/source analytical guardrails
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_analysis_contracts.py
      - name: Validate Aug. 23 public UX
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_public_ux_20260823.py
      - name: Validate forensic v1.3.2 analytical package
        env:
          PYTHONUTF8: '1'
        run: python data/forensic-v1.3.2/validate-addon.py
      - name: Validate full-scope design and analytical locks
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_full_scope.py
      - name: Validate Aug. 22 canonical/workspace update
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_aug22_update.py
      - name: Validate Aug. 24 count synchronization after full regression suite
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_aug24_counts.py
