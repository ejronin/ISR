name: Validate public evidence atlas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install pinned build-time image decoder
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
          python -m pip check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Regenerate and validate pinned Natural Earth reference geography
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/build_reference_geography.py --fetch-source-dir "$RUNNER_TEMP/atlas-natural-earth-v5.1.1" --check
          python scripts/validate_public_geography.py

      - name: Protect immutable migration authority and append-only ledger history
        env:
          AUTHORITY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_canonical_authority.py --compare-ref "$AUTHORITY_BASE_REF"

      - name: Build exhaustive source registry
        run: python scripts/build_source_registry.py --root .

      - name: Build and validate current canonical/public release
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/build_current_release_state.py
          python scripts/build_current_release_state.py --check
          python tests/current-release-state-orchestration.test.py
          python tests/canonical-authority.test.py
          python tests/canonical-update-pipeline.test.py
          python tests/gate3-packet-hash-portability.test.py
          python scripts/migrate_lie_ledger_evidence_adjudications.py --check
          python tests/lie-ledger-governance-neutralization.test.py
          python tests/evidence-semantic-edge-regressions.test.py
          python scripts/build_public_release.py
          python scripts/build_public_release.py --check
          python scripts/validate_public_deployment.py
          python scripts/validate_public_geography.py
          python scripts/validate_public_runtime_inventory.py
          python tests/public-runtime-inventory.test.py
          python tests/public-release-evidence-image.test.py
          python tests/public-release-state-flags.test.py
          node tests/public-current-state.test.js
          node tests/public-boot.test.js
          node tests/public-ia.test.js
          node tests/public-content-redesign.test.js
          node tests/public-evidence-phase5.test.js
          node tests/public-map-phase6.test.js
          node tests/public-loss-actor-batch2.test.js
          node tests/public-parity-batch3.test.js
          node tests/public-phase9.test.js
          node tests/security-rendering.test.js
          node tests/public-reader-layer.test.js
          node tests/public-final-polish.test.js
          python tests/neutral-current-narrative.test.py
          node --check js/public-bootstrap.js
          node --check js/public-app.js
          node --check js/public-ia.js
          node --check src/public-reader-layer.js
          node --check tests/browser-public-boot-smoke.js
          node --check tests/browser-public-final-polish.js
          node --check tests/browser-public-render-review.js
          node --check tests/browser-public-ia-smoke.js
          node --check tests/browser-public-evidence-phase5.js
          node --check tests/browser-public-map-phase6.js
          node --check tests/browser-public-loss-actor-batch2.js
          node --check tests/browser-public-parity-batch3.js
          node --check tests/browser-public-phase9.js
          node --check tests/browser-public-responsive-phase9.js
          python scripts/assemble_public_site.py --output _site
          python scripts/write_build_info.py --output _site/build-info.json --commit "$GITHUB_SHA"
          python scripts/assemble_public_site.py --output _site --check --require-build-info
          python scripts/validate_public_runtime_inventory.py --site-root _site --require-build-info
          python scripts/validate_public_deployment.py --site-root _site --require-build-info
          python scripts/validate.py

      - name: Exercise current public reader paths in headless browser
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/atlas-http.log 2>&1 &
          server_pid=$!
          browser_pid=''
          process_is_running(){
            local pid="$1"
            local state=''
            kill -0 "$pid" 2>/dev/null || return 1
            if [ -r "/proc/$pid/stat" ]; then
              state="$(sed -E 's/^.*\) ([A-Z]) .*/\1/' "/proc/$pid/stat" 2>/dev/null)" || true
              [ "$state" != 'Z' ]
              return
            fi
            return 0
          }
          terminate_process(){
            local pid="${1:-}"
            local label="${2:-process}"
            local deadline
            [ -n "$pid" ] || return 0
            if process_is_running "$pid"; then
              echo "Stopping $label (pid $pid) with TERM." >&2
              kill -TERM "$pid" 2>/dev/null || true
              deadline=$((SECONDS + 5))
              while process_is_running "$pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.1
              done
            fi
            if process_is_running "$pid"; then
              echo "$label (pid $pid) did not exit after TERM; sending KILL." >&2
              kill -KILL "$pid" 2>/dev/null || true
              deadline=$((SECONDS + 2))
              while process_is_running "$pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.1
              done
            fi
            if process_is_running "$pid"; then
              echo "WARN: $label (pid $pid) is still present after KILL." >&2
              return 1
            fi
          }
          cleanup(){
            terminate_process "$browser_pid" 'browser' || true
            terminate_process "$server_pid" 'HTTP server' || true
          }
          trap cleanup EXIT
          mapfile -t browsers < <(
            for name in chromium google-chrome-stable google-chrome chromium-browser; do
              command -v "$name" 2>/dev/null || true
            done | awk '!seen[$0]++'
          )
          if [ "${#browsers[@]}" -eq 0 ]; then
            echo 'FAIL: no Chrome/Chromium executable is available for the public UI smoke test.' >&2
            exit 1
          fi
          ready=0
          browser=''
          for candidate in "${browsers[@]}"; do
            echo "Browser candidate: $candidate"
            timeout --signal=KILL 5s "$candidate" --version || true
            rm -rf /tmp/atlas-chrome-profile
            : >/tmp/atlas-chrome.log
            "$candidate" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --no-default-browser-check \
              --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
              --remote-allow-origins='*' --user-data-dir=/tmp/atlas-chrome-profile \
              'http://127.0.0.1:8765/?view=strikes' >/tmp/atlas-chrome.log 2>&1 &
            browser_pid=$!
            deadline=$((SECONDS + 15))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if curl -fsS --connect-timeout 1 --max-time 1 \
                http://127.0.0.1:9222/json/version >/tmp/atlas-cdp-version.json 2>/dev/null; then
                ready=1
                browser="$candidate"
                break
              fi
              if ! kill -0 "$browser_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            if [ "$ready" -eq 1 ]; then break; fi
            if process_is_running "$browser_pid"; then
              candidate_status='still running without CDP'
            else
              candidate_status='exited before exposing CDP'
            fi
            terminate_process "$browser_pid" "browser candidate $candidate" || true
            echo "Browser candidate failed ($candidate_status): $candidate" >&2
            cat /tmp/atlas-chrome.log >&2 || true
            browser_pid=''
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/atlas-http.log >&2 || true
            echo 'FAIL: no installed Chrome/Chromium candidate exposed a DevTools endpoint.' >&2
            exit 1
          fi
          echo "Selected browser path: $browser"
          timeout --signal=KILL 5s "$browser" --version || true
          cat /tmp/atlas-cdp-version.json
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-boot-smoke.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-ia-smoke.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-evidence-phase5.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-map-phase6.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-parity-batch3.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-loss-actor-batch2.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-responsive-phase9.js
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-phase9.js

      - name: Scan tracked files and Git metadata for privacy regressions
        run: python scripts/privacy_scan.py
