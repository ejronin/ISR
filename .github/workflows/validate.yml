name: Validate public evidence atlas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build exhaustive source registry
        run: python scripts/build_source_registry.py --root .
      - name: Validate Aug. 24 count synchronization after source build
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_aug24_counts.py
      - name: Validate static atlas
        run: python scripts/validate.py
      - name: Validate historical-ledger integration
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_integration.py
      - name: Validate UX and security release gates
        run: python scripts/validate_ux.py
      - name: Scan tracked files and Git metadata for privacy regressions
        run: python scripts/privacy_scan.py
      - name: Run deterministic presentation, temporal, costing, hostile-input, and public-IA tests
        run: |
          node tests/presentation.test.js
          node tests/temporal-state.test.js
          node tests/security-rendering.test.js
          node tests/costing.test.js
          node tests/forensic-v1.3.2.test.js
          node tests/full-scope-20260822.test.js
          node tests/aug22-update.test.js
          node tests/endgame-page.test.js
          node tests/public-ux-20260823.test.js
          node tests/public-record-ia-20260826.test.js
          node tests/aug24-current-update.test.js
          node tests/ui-endgame-mermaid-r1.test.js
      - name: Validate ENDGAME analytical page
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_endgame_page.py
      - name: Validate compact shell, Mermaid adjudication and source context
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_ui_endgame_mermaid_r1.py
      - name: Validate ENDGAME / MOU / Public View R1
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_endgame_public_view_r1.py
      - name: Validate ENDGAME plain-language UX R1
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/endgame-ux-plain-language-r1.js
          python scripts/validate_endgame_ux_plain_language_r1.py
      - name: Validate workspace plain-language UX R1
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/workspace-ux-plain-language-r1.js
          python scripts/validate_workspace_ux_plain_language_r1.py
      - name: Validate final Mermaid fit and Oil Routes R1
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/final-mermaid-oil-routes-r1.js
          python scripts/validate_final_mermaid_oil_routes_r1.py
      - name: Validate Endgame/source analytical guardrails
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_analysis_contracts.py
      - name: Validate Aug. 23 public UX
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_public_ux_20260823.py
      - name: Validate forensic v1.3.2 analytical package
        env:
          PYTHONUTF8: '1'
        run: python data/forensic-v1.3.2/validate-addon.py
      - name: Validate full-scope design and analytical locks
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_full_scope.py
      - name: Validate Aug. 22 canonical/workspace update
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_aug22_update.py
      - name: Validate Aug. 24 count synchronization after full regression suite
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_aug24_counts.py
