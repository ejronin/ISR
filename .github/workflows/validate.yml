name: Validate public evidence atlas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static atlas
        run: python scripts/validate.py
      - name: Validate historical-ledger integration
        env:
          PYTHONUTF8: '1'
        run: python scripts/validate_integration.py
