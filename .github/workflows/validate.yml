name: Validate public evidence atlas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/release-qualification.yml
    with:
      commit_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      authority_base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      prepare_pages_artifact: false
