name: Validate evidence and canonical invariants

on:
  push:
    branches: [main]
    paths:
      - "data/canonical-ledger/**"
      - "data/canonical-updates/**"
      - "data/gate3/**"
      - "data/lie-ledger-v2-evidence-adjudications.json"
      - "data/lie-ledger-v2-evidence-sources-20260909.json"
      - "data/forensic-v1.3.2/**"
      - "docs/LIE_LEDGER_EVIDENCE_ADJUDICATION_CONTRACT.md"
      - "docs/release-qualification.md"
      - "schemas/canonical-*-v2.json"
      - "schemas/lie-ledger-evidence-adjudication-v2.json"
      - "scripts/build_canonical_current_state_v2*.py"
      - "scripts/build_lie_ledger_evidence_adjudication.py"
      - "scripts/build_public_current_state_v2*.py"
      - "scripts/canonical_temporal_contract.py"
      - "scripts/gate3_v2_registration.py"
      - "scripts/migrate_lie_ledger_evidence_adjudications.py"
      - "scripts/neutralize_lie_ledger_governance.py"
      - "scripts/validate_gate3*.py"
      - "scripts/validate_lie_ledger_v2.py"
      - "scripts/validate_public_current_state_v2.py"
      - "tests/canonical-*.test.py"
      - "tests/gate3-*.test.py"
      - "tests/lie-ledger-governance-neutralization.test.py"
      - "tests/evidence-governance-boundary.test.py"
      - "tests/release-qualification-topology.test.py"
      - "requirements-build.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "data/canonical-ledger/**"
      - "data/canonical-updates/**"
      - "data/gate3/**"
      - "data/lie-ledger-v2-evidence-adjudications.json"
      - "data/lie-ledger-v2-evidence-sources-20260909.json"
      - "data/forensic-v1.3.2/**"
      - "docs/LIE_LEDGER_EVIDENCE_ADJUDICATION_CONTRACT.md"
      - "docs/release-qualification.md"
      - "schemas/canonical-*-v2.json"
      - "schemas/lie-ledger-evidence-adjudication-v2.json"
      - "scripts/build_canonical_current_state_v2*.py"
      - "scripts/build_lie_ledger_evidence_adjudication.py"
      - "scripts/build_public_current_state_v2*.py"
      - "scripts/canonical_temporal_contract.py"
      - "scripts/gate3_v2_registration.py"
      - "scripts/migrate_lie_ledger_evidence_adjudications.py"
      - "scripts/neutralize_lie_ledger_governance.py"
      - "scripts/validate_gate3*.py"
      - "scripts/validate_lie_ledger_v2.py"
      - "scripts/validate_public_current_state_v2.py"
      - "tests/canonical-*.test.py"
      - "tests/gate3-*.test.py"
      - "tests/lie-ledger-governance-neutralization.test.py"
      - "tests/evidence-governance-boundary.test.py"
      - "tests/release-qualification-topology.test.py"
      - "requirements-build.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  evidence-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned validation requirements
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
          python -m pip check
      - name: Build exhaustive source registry
        run: python scripts/build_source_registry.py --root .
      - name: Protect accepted history, update mechanics, and qualification topology
        env:
          AUTHORITY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "$(git merge-base HEAD origin/main)" HEAD
          python tests/release-qualification-topology.test.py
          python scripts/validate_canonical_authority.py --compare-ref "$AUTHORITY_BASE_REF"
          python tests/canonical-authority.test.py
          python tests/canonical-update-pipeline.test.py
          python tests/gate3-packet-hash-portability.test.py
      - name: Validate registration and temporal semantics
        run: |
          python tests/gate3-v2-mutable-current-invariants.test.py
          python scripts/gate3_v2_registration.py --verify
          python tests/gate3-v2-registration.test.py
          python tests/gate3-v2-temporal-contract.test.py
          python tests/gate3-v2-temporal-consumer-agreement.test.py
          python tests/gate3-v2-sep7-replay.test.py
          python tests/gate3-v2-forward-update-canary.test.py
          python tests/gate3-v2-delayed-knowledge-canary.test.py
      - name: Validate neutral evidence adjudication
        run: |
          python scripts/migrate_lie_ledger_evidence_adjudications.py --check
          python tests/lie-ledger-governance-neutralization.test.py
          python tests/evidence-governance-boundary.test.py
      - name: Build and verify the current release state
        run: |
          python scripts/build_current_release_state.py
          python scripts/build_current_release_state.py --check
      - name: Run focused semantic validators
        run: |
          set -o pipefail
          python scripts/validate_gate3_final.py 2>&1 | tee canonical-validator.log
          python scripts/validate_lie_ledger_v2.py 2>&1 | tee lie-ledger-validator.log
          python scripts/validate_public_current_state_v2.py 2>&1 | tee public-projection-validator.log
      - name: Upload evidence diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-integrity-diagnostics-${{ github.sha }}
          path: |
            canonical-validator.log
            lie-ledger-validator.log
            public-projection-validator.log
          if-no-files-found: ignore
          retention-days: 7
