name: Sep 6 browser contract patch (temporary)

on:
  push:
    branches:
      - update/sep6-evidence-20260906

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sep6-browser-contracts-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Apply exact Sep. 6 browser contract replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          bs = chr(92)
          patches = {
              'tests/browser-public-ia-smoke.js': [
                  (f'/52{bs}s+material-loss records/', f'/57{bs}s+material-loss records/', 1),
              ],
              'tests/browser-public-loss-actor-batch2.js': [
                  ('if (losses.cardCount !== 52)', 'if (losses.cardCount !== 57)', 1),
                  ('assert.equal(losses.cardCount, 52);', 'assert.equal(losses.cardCount, 57);', 1),
                  ('assert.equal(losses.uniqueIds, 52);', 'assert.equal(losses.uniqueIds, 57);', 1),
                  ('assert.equal(losses.visibleCount, 52);', 'assert.equal(losses.visibleCount, 57);', 1),
                  ('assert.equal(filtered.before, 52);', 'assert.equal(filtered.before, 57);', 1),
                  ("assert.equal(filtered.after, 52, 'filter deleted underlying loss records');", "assert.equal(filtered.after, 57, 'filter deleted underlying loss records');", 1),
                  ('assert(filtered.visible > 0 && filtered.visible < 52);', 'assert(filtered.visible > 0 && filtered.visible < 57);', 1),
                  ('assert.equal(mobile.cards, 52);', 'assert.equal(mobile.cards, 57);', 1),
              ],
              'tests/browser-public-phase9.js': [
                  ('/190 conflict days are represented/', '/191 conflict days are represented/', 1),
                  ("assert.equal(acceptedNarrativeFunctions.filter(record => record.narrativeFunction).length, 15, 'accepted populated narrative-function count changed');", "assert.equal(acceptedNarrativeFunctions.filter(record => record.narrativeFunction).length, 21, 'accepted populated narrative-function count changed');", 1),
                  ('assert.equal(populatedNarrativeFunctionDetails.length, 15);', 'assert.equal(populatedNarrativeFunctionDetails.length, 21);', 1),
              ],
          }
          for name, replacements in patches.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f'{name}: expected {expected} occurrence(s) of {old!r}, found {actual}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          print('Sep. 6 browser contract replacements applied with exact occurrence checks.')
          PY
          git diff --check
      - name: Commit browser contract repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'atlas-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-public-ia-smoke.js tests/browser-public-loss-actor-batch2.js tests/browser-public-phase9.js
          git diff --cached --check
          git commit -m 'Refresh Sep. 6 browser regression contracts [sep6-browser-contracts-applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
