name: Patch Phase 10 analytical hero ordering

on:
  push:
    branches:
      - ux/phase10-visual-sweep-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/phase10-visual-sweep-20260907
      - name: Put analytical visual before local section navigation
        shell: python
        run: |
          from pathlib import Path

          js = Path('js/public-ia.js')
          text = js.read_text()
          old = "  const intro = article.querySelector('.page-intro'); const clocks = article.querySelector('.evidence-clock-bar'); const glance = article.querySelector('.at-a-glance'); (clocks || glance || intro).after(nav);"
          new = "  const intro = article.querySelector('.page-intro'); const clocks = article.querySelector('.evidence-clock-bar'); const glance = article.querySelector('.at-a-glance'); const analyticalHero = article.querySelector('.analytical-hero'); (analyticalHero || clocks || glance || intro).after(nav);"
          if text.count(old) != 1:
              raise SystemExit(f'local-nav insertion point changed: found {text.count(old)} matches')
          js.write_text(text.replace(old, new, 1))

          test = Path('tests/public-phase10.test.js')
          t = test.read_text()
          marker = "assert(css.includes('Phase 10 approved visual sweep'));\n"
          addition = "assert(source.includes(\"const analyticalHero = article.querySelector('.analytical-hero')\"), 'analytical hero is not recognized by local navigation');\nassert(source.includes('(analyticalHero || clocks || glance || intro).after(nav)'), 'local section navigation can still precede the analytical hero');\n"
          if addition not in t:
              if marker not in t:
                  raise SystemExit('visual-sweep static contract insertion point changed')
              t = t.replace(marker, marker + addition, 1)
              test.write_text(t)
      - name: Verify syntax and Phase 10 static contract
        shell: bash
        run: |
          set -euo pipefail
          node --check js/public-ia.js
          node --check tests/browser-public-render-review.js
          python scripts/build_source_registry.py --root .
          python scripts/build_canonical_current_state.py
          python scripts/build_public_current_state.py
          python scripts/build_canonical_current_state_v2_final.py --output data/canonical-current-state-v2.json
          python scripts/build_public_current_state_v2_hardened.py --output data/public-current-state.json
          node tests/public-phase10.test.js
      - name: Commit durable ordering repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/public-ia.js tests/public-phase10.test.js
          git commit -m 'Put analytical visuals before local navigation'
          git push origin HEAD:ux/phase10-visual-sweep-20260907
