          replace_once(ia, "        append(body, 'h4', '', 'Sources');", "        append(body, 'h4', '', 'Source reporting');")

          old_campaign = "    const boundary = addSection(frame.article, 'How an attack becomes a demonstrated effect'); const ladder = append(boundary, 'ol', 'evidence-ladder'); ['Launch', 'Defense / interception', 'Impact', 'Physical damage', 'Operational / mission effect', 'Strategic effect'].forEach(label => append(ladder, 'li', '', label)); append(boundary, 'p', 'section-note', 'Evidence at one stage does not establish the next. Any stage can remain unknown, unresolved or not demonstrated.');"
          new_campaign = "    const boundary = addSection(frame.article, 'From damage to strategic effect'); append(boundary, 'p', 'phase10-guardrail', 'A confirmed hit does not by itself establish destroyed capability or strategic effect.'); const framework = append(boundary, 'div', 'effect-framework-grid'); [['Physical damage', 'Observable physical harm. Does not establish loss of operational function.'], ['Asset lost', 'An individual asset is established destroyed, sunk, captured, abandoned, or otherwise unavailable. This does not establish elimination of the broader capability.'], ['Subsystem degraded', 'A component has been reduced or lost while the larger platform or system may retain other functions.'], ['Function degraded', 'A specific operational function is reduced, interrupted, or unavailable. This can occur without physical destruction.'], ['Local operational effect', 'A demonstrated effect at a specific site, unit, or limited area.'], ['Theater operational effect', 'A material influence on the broader campaign or theater.'], ['Strategic consequence', 'A material effect on the actor’s ability to achieve major objectives, the strategic balance, or the end state.']].forEach(([title, text]) => { const card = append(framework, 'article', 'effect-framework-card'); append(card, 'h3', '', title); append(card, 'p', '', text); }); append(boundary, 'p', 'section-note', 'This is an effects framework, not an automatic severity staircase. Asset loss and functional degradation are independent analytical dimensions; Atlas does not transform hit → destroyed → capability eliminated → strategic defeat unless each step is independently supported.');"
          replace_once(ia, old_campaign, new_campaign)

          old_loss = "  function addLossCard(host, context, record) {\n    const card = addProvenanceCard(host, context, {\n      kicker: `${publicNarrative(record.side, 'Side unresolved')} · ${plainLabel(record.status, 'Physical state unresolved')}`,\n      title: `${formatQuantity(record)} · ${publicNarrative(record.item, 'Material item')}`, text: publicNarrative(record.note), technicalId: record.loss_id, item: record\n    });\n    card.dataset.lossId = record.loss_id; card.dataset.lossActor = String(record.owner || record.side || '').toLowerCase(); card.dataset.lossService = String(record.service || '').toLowerCase(); card.dataset.lossClass = String(record.accounting_category || '').toLowerCase(); card.dataset.lossPhysical = String(record.status || '').toLowerCase(); card.dataset.lossEvidence = String(record.confidence || '').toLowerCase();\n    appendActorIdentities(card, context, [record.owner || record.side]);\n    addFactList(card, [['Service', publicNarrative(record.service, 'Unresolved')], ['Type', plainLabel(record.accounting_category, 'Unresolved')], ['Quantity status', record.quantity === null || record.quantity === undefined ? 'Unknown; not zero' : publicNarrative(record.quantity_qualifier, 'Exact quantity recorded')], ['Loss status', plainLabel(record.status, 'Unresolved')], ['Evidence confidence', plainLabel(record.confidence, 'Unresolved')], ['Date', readableDate(record.event_date)]]);"
          new_loss = "  function addLossCard(host, context, record) {\n    const card = addProvenanceCard(host, context, {\n      kicker: `${publicNarrative(record.side, 'Side unresolved')} · ${materialAssetClass(record)} · ${plainLabel(record.status, 'Physical state unresolved')}`,\n      title: `${lossQuantityLabel(record)} · ${publicNarrative(record.item, 'Material item')}`, text: publicNarrative(record.note), technicalId: record.loss_id, item: record\n    });\n    card.dataset.lossId = record.loss_id; card.dataset.lossActor = String(record.owner || record.side || '').toLowerCase(); card.dataset.lossService = String(record.service || '').toLowerCase(); card.dataset.lossClass = String(record.accounting_category || '').toLowerCase(); card.dataset.lossPhysical = String(record.status || '').toLowerCase(); card.dataset.lossEvidence = String(record.confidence || '').toLowerCase();\n    appendActorIdentities(card, context, [record.owner || record.side]);\n    addFactList(card, [['Asset class', materialAssetClass(record)], ['Service', publicNarrative(record.service, 'Unresolved')], ['Type', plainLabel(record.accounting_category, 'Unresolved')], ['Quantity', record.quantity === null || record.quantity === undefined ? 'Unknown' : formatQuantity(record)], ['Quantity rule', record.quantity === null || record.quantity === undefined ? 'Unknown does not mean zero' : publicNarrative(record.quantity_qualifier, 'Exact quantity recorded')], ['Loss status', plainLabel(record.status, 'Unresolved')], ['Evidence confidence', plainLabel(record.confidence, 'Unresolved')], ['Date', readableDate(record.event_date)]]);"
