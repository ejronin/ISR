name: Apply Phase 10 UX presentation

on:
  push:
    branches:
      - ux/phase10-language-presentation-20260906
    paths:
      - .github/workflows/phase10-ux-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Extract and apply focused presentation patch
        shell: bash
        run: |
          awk '
            $0 == "          python - <<\047PY\047" { capture=1; next }
            capture && $0 == "          PY" { exit }
            capture { sub(/^          /, ""); print }
          ' .github/phase10-ux-apply-source.txt > /tmp/phase10-apply.py
          test -s /tmp/phase10-apply.py
          python /tmp/phase10-apply.py
          git restore .github/workflows/validate.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/public-phase9.test.js')
          text = p.read_text(encoding='utf-8')
          hook = "require('./public-phase10.test.js');"
          if hook not in text:
              text = text.rstrip() + "\n\n" + hook + "\n"
          p.write_text(text, encoding='utf-8')
          PY
          node --check tests/public-phase9.test.js
      - name: Commit Phase 10 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/phase10-ux-apply-source.txt
          git add js/public-ia.js css/public-shell.css tests/public-phase10.test.js tests/public-phase9.test.js tests/browser-public-phase9.js
          git commit -m 'Implement Phase 10 evidence-state UX language'
          git push origin HEAD:ux/phase10-language-presentation-20260906
