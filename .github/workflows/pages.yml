name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qualify:
    name: qualify exact merge SHA
    uses: ./.github/workflows/release-qualification.yml
    with:
      commit_sha: ${{ github.sha }}
      authority_base_ref: ${{ github.event_name == 'push' && github.event.before || '' }}
      prepare_pages_artifact: true

  deploy:
    name: deploy qualified SHA
    needs: qualify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prove qualified SHA handoff
        env:
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
        run: |
          set -euo pipefail
          test -n "$QUALIFIED_SHA"
          test "$QUALIFIED_SHA" = "$GITHUB_SHA"
          echo "Pages artifact qualified for exact SHA $QUALIFIED_SHA"
      - name: Deploy exact qualified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  attest:
    name: attest live deployment
    needs: [qualify, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Download qualified release identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-attestation-input-${{ github.sha }}
          path: expected-release
      - name: Resolve exact-SHA Pages environment deployment identity
        id: deployment_identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          params = urllib.parse.urlencode({'sha': sha, 'environment': 'github-pages', 'per_page': 20})
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/deployments?{params}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'atlas-release-attestation/1.0',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              rows = json.load(response)
          rows = [row for row in rows if row.get('sha') == sha and row.get('environment') == 'github-pages']
          if not rows:
              raise SystemExit(f'FAIL: no github-pages deployment record exists for exact SHA {sha}')
          row = max(rows, key=lambda item: (item.get('created_at') or '', int(item.get('id') or 0)))
          output = os.environ['GITHUB_OUTPUT']
          with open(output, 'a', encoding='utf-8') as handle:
              handle.write(f"deployment_id={row['id']}\n")
              handle.write(f"deployment_created_at={row.get('created_at') or ''}\n")
          print(f"Resolved github-pages deployment id={row['id']} sha={row['sha']} created_at={row.get('created_at')}")
          PY
      - name: Prove live Pages bytes match the qualified SHA
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          PAGE_DEPLOYMENT_ID: ${{ steps.deployment_identity.outputs.deployment_id }}
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$QUALIFIED_SHA" = "$GITHUB_SHA"
          python scripts/attest_live_deployment.py \
            --base-url "$PAGE_URL" \
            --expected-commit "$GITHUB_SHA" \
            --expected-manifest expected-release/data/public-release.json \
            --expected-state expected-release/data/public-current-state.json \
            --expected-build-info expected-release/_site/build-info.json \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-name "$GITHUB_WORKFLOW" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --deployment-id "$PAGE_DEPLOYMENT_ID" \
            --output deployment-attestation.json
          cat deployment-attestation.json
      - name: Persist live deployment attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-deployment-attestation-${{ github.sha }}
          path: deployment-attestation.json
          if-no-files-found: error
          retention-days: 90
