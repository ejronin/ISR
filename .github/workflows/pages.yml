name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Assemble static artifact and deployment identity
        run: |
          python scripts/build_source_registry.py --root .
          python scripts/build_canonical_current_state.py
          python scripts/build_canonical_current_state.py --check
          python scripts/validate_canonical_update_pipeline.py
          python scripts/build_public_current_state.py
          python scripts/validate_public_current_state.py
          python scripts/build_public_release.py
          python scripts/build_public_release.py --check
          python scripts/validate_public_deployment.py
          mkdir _site
          cp -R index.html .nojekyll assets css data js schemas snapshots vendor _site/
          python scripts/write_build_info.py --output _site/build-info.json --commit "$GITHUB_SHA"
          python scripts/validate_public_deployment.py --site-root _site --require-build-info
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
