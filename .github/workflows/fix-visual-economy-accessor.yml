name: Fix visual economy accessor

on:
  push:
    branches:
      - ux/phase10-visual-sweep-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/phase10-visual-sweep-20260907
      - name: Align economy visual with hardened public shape
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'js/public-ia.js': [("const outlook = payload.economicOutlook || payload.economic_outlook || {};", "const outlook = payload.forecast_context || payload.economicOutlook || payload.economic_outlook || {};")],
            'tests/public-phase10.test.js': [("economyPayload.economicOutlook?.rows", "economyPayload.forecast_context?.rows")],
            'tests/browser-public-phase9.js': [("model.datasets['ledger.economics'].payload.economicOutlook.rows.length", "model.datasets['ledger.economics'].payload.forecast_context.rows.length")]
          }
          for name, pairs in replacements.items():
            path = Path(name); text = path.read_text()
            for old, new in pairs:
              if text.count(old) != 1:
                raise SystemExit(f'{name}: expected one {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
            path.write_text(text)
      - name: Verify syntax
        run: |
          node --check js/public-ia.js
          node --check tests/public-phase10.test.js
          node --check tests/browser-public-phase9.js
      - name: Commit economy accessor repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/public-ia.js tests/public-phase10.test.js tests/browser-public-phase9.js
          git commit -m 'Align economy visual with hardened public model'
          git push origin HEAD:ux/phase10-visual-sweep-20260907
