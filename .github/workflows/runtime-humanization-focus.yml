name: Runtime source humanization focus

on:
  push:
    branches:
      - fix/phase9-runtime-humanization-20260906

permissions:
  contents: read

jobs:
  source-humanization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned build dependency
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
      - name: Generate focused public artifact
        env:
          PYTHONUTF8: '1'
        run: |
          node --check js/public-ia.js
          node --check tests/browser-public-source-humanization-focus.js
          python scripts/build_source_registry.py --root .
          python scripts/build_canonical_current_state.py
          python scripts/build_public_current_state.py
          python scripts/build_canonical_current_state_v2_final.py --output data/canonical-current-state-v2.json
          python scripts/build_public_current_state_v2_hardened.py --output data/public-current-state.json
          python scripts/build_public_release.py
          python scripts/assemble_public_site.py --output _site
          python scripts/write_build_info.py --output _site/build-info.json --commit "$GITHUB_SHA"
      - name: Qualify source humanization at 390px
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/atlas-focus-http.log 2>&1 &
          server_pid=$!
          browser_pid=''
          cleanup(){
            if [ -n "$browser_pid" ]; then kill "$browser_pid" 2>/dev/null || true; fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          browser=''
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          if [ -z "$browser" ]; then
            echo 'FAIL: no Chrome/Chromium executable available.' >&2
            exit 1
          fi
          rm -rf /tmp/atlas-focus-profile
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --remote-allow-origins='*' --user-data-dir=/tmp/atlas-focus-profile \
            'http://127.0.0.1:8765/#/evidence/sources' >/tmp/atlas-focus-chrome.log 2>&1 &
          browser_pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --connect-timeout 1 --max-time 1 http://127.0.0.1:9222/json/version >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/atlas-focus-chrome.log >&2 || true
            exit 1
          fi
          ATLAS_CDP=http://127.0.0.1:9222 ATLAS_SITE=http://127.0.0.1:8765/ node tests/browser-public-source-humanization-focus.js
