name: Promote neutral entrypoint once

on:
  push:
    branches:
      - release/direct-public-entrypoint-20260910
    paths:
      - ".github/workflows/promote-neutral-entrypoint-once.yml"
      - "js/public-app.js"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/direct-public-entrypoint-20260910
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Promote already-qualified neutral entrypoint bytes
        run: |
          python scripts/retire_privileged_narrative_runtime.py
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('js/public-app.js')
          data = path.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          digest = sha256(data).hexdigest()
          expected = 'c75725d4c3164a014222fb996abd18aabe52e1564b092a0ca5b6ee407c8af638'
          if digest != expected:
              raise SystemExit(f'FAIL: promoted entrypoint hash {digest} != qualified deployed hash {expected}')
          print(f'qualified neutral entrypoint: {digest}')
          PY
      - name: Commit neutral tracked source when needed
        run: |
          if git diff --quiet -- js/public-app.js; then
            echo "Tracked entrypoint is already neutral; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/public-app.js
          git commit -m "Promote neutral public entrypoint source"
          git push origin HEAD:release/direct-public-entrypoint-20260910
