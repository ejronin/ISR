name: Temporary fix War90 mobile composition
on:
  push:
    branches: [tmp/project-lead-mobile-war90-20260909]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[war90-mobile-done]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply mobile composition repair
        run: python .tmp/fix_war90_mobile.py
      - name: Build deterministic state
        run: |
          python scripts/build_source_registry.py --root .
          python scripts/build_canonical_current_state.py
          python scripts/build_public_current_state.py
          python scripts/build_canonical_current_state_v2_final.py --output data/canonical-current-state-v2.json
          python scripts/build_public_current_state_v2_hardened.py --output data/public-current-state.json
      - name: Verify static contracts
        run: |
          node --check js/public-ia.js
          node --check tests/browser-public-final-polish.js
          node tests/public-ia.test.js
          node tests/public-final-polish.test.js
      - name: Commit verified result
        run: |
          git config user.name 'Atlas Project Lead Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add js/public-ia.js tests/browser-public-final-polish.js
          git commit -m '[war90-mobile-done] Fix War in 90 Seconds mobile composition'
          git push origin HEAD:tmp/project-lead-mobile-war90-20260909
