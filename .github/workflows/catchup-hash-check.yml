name: Catch-up packet hash check

on:
  push:
    branches:
      - "rook/catchup-20260909"

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print canonical packet hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for path in (
              'data/canonical-updates/UPD-20260907-CATCHUP.json',
              'data/canonical-updates/UPD-20260908-CATCHUP.json',
              'data/canonical-updates/UPD-20260909-CATCHUP.json',
          ):
              raw = Path(path).read_bytes().replace(b'\r\n', b'\n')
              print(path, hashlib.sha256(raw).hexdigest(), len(raw))
          PY
