name: Final polish typography one-shot

on:
  push:
    branches: [ux/final-polish-20260908]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/final-polish-20260908
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Apply typography repair
        run: python tools/_final_polish_typography_fix.py
      - name: Verify source contract
        run: |
          grep -q 'font-size: .72rem; padding: .15rem' css/public-shell.css
          ! grep -q 'font-size: .58rem' css/public-shell.css
          git diff --check
      - name: Commit durable repair
        run: |
          rm -f tools/_final_polish_typography_fix.py
          git add css/public-shell.css tools/_final_polish_typography_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce readable MOU typography floor'
          git push origin HEAD:ux/final-polish-20260908
