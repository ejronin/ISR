name: Apply Phase 10 label collision repair

on:
  push:
    branches:
      - ux/phase10-visual-sweep-20260907

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/phase10-visual-sweep-20260907
      - name: Apply staged collision repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_phase10_label_collision_patch.py
          node --check js/public-ia.js
          node --check tests/browser-public-render-review.js
          node --check tests/public-phase10.test.js
      - name: Commit durable repair and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_phase10_label_collision_patch.py .github/workflows/apply-phase10-label-collision.yml
          git add js/public-ia.js css/public-shell.css tests/browser-public-render-review.js tests/public-phase10.test.js
          git commit -m 'Suppress compact map label collisions'
          git push origin HEAD:ux/phase10-visual-sweep-20260907
