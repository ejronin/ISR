name: Finalize Wikipedia reconciliation

on:
  push:
    branches:
      - wiki-regional-reconciliation-finish-20260826
    paths:
      - 'scripts/materialize_wiki_reconciliation.py'
      - 'scripts/validate_wiki_reconciliation.py'
      - 'scripts/apply_wiki_reconciliation_integration.py'
      - 'js/wiki-map-reconciliation-20260826.js'
      - 'scripts/write_build_info.py'
      - 'scripts/validate_build_info_current.py'
      - '.github/workflows/finalize-wiki-reconciliation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize audited reconciliation JSON
        run: python scripts/materialize_wiki_reconciliation.py
      - name: Apply minimal runtime and source-registry integration
        run: python scripts/apply_wiki_reconciliation_integration.py
      - name: Rebuild source directory
        run: python scripts/build_source_registry.py --root .
      - name: Validate reconciliation and frozen-base invariants
        run: |
          python scripts/validate_wiki_reconciliation.py
          python scripts/validate_aug24_counts.py
          python scripts/validate_build_info_current.py
          node --check js/wiki-map-reconciliation-20260826.js
          node --check js/current-update-20260826.js
          node --check js/app.js
          git diff --check
      - name: Commit generated reconciliation products
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wiki-map-reconciliation-20260826 \
                  data/source-registry.json data/source-registry.csv data/outlet-profiles.json \
                  js/app.js js/current-update-20260826.js \
                  scripts/build_source_registry.py scripts/validate_aug24_counts.py
          git commit -m 'Materialize and wire regional reconciliation'
          git push
