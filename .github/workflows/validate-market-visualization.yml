name: Validate researched financial visualization

on:
  pull_request:
    paths:
      - 'data/research/eia-brent-spot-2026-visual-candidate.json'
      - 'prototypes/visualization-platform/**'
      - '.github/workflows/validate-market-visualization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned build requirements
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
      - name: Install pinned visualization dependencies
        working-directory: prototypes/visualization-platform
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate source facts and bundle the real-market prototype
        working-directory: prototypes/visualization-platform
        run: npm run build
      - name: Check compiled research artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s prototypes/visualization-platform/dist/prototypes/visualization-platform/index.html
          test -s prototypes/visualization-platform/dist/prototypes/visualization-platform/market-preview.html
          test -s prototypes/visualization-platform/dist/data/research/eia-brent-spot-2026-visual-candidate.json
          grep -q 'EXTERNAL_PRIMARY_SOURCE_RESEARCH_NOT_ACCEPTED_AS_CANONICAL' prototypes/visualization-platform/dist/data/research/eia-brent-spot-2026-visual-candidate.json

      - name: Browser screenshot and market source-interaction QA at desktop/mobile widths
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v chromium || command -v google-chrome-stable || command -v google-chrome)"
          mkdir -p market-qa-screens
          python -m http.server 4173 --bind 127.0.0.1 --directory prototypes/visualization-platform/dist >/tmp/market-qa-http.log 2>&1 &
          SERVER=$!
          PROFILE="$(mktemp -d)"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --remote-allow-origins='*' \
            --user-data-dir="$PROFILE" http://127.0.0.1:4173/prototypes/visualization-platform/market-preview.html \
            >/tmp/market-qa-browser.log 2>&1 &
          BROWSER=$!
          trap 'kill "$BROWSER" "$SERVER" 2>/dev/null || true; rm -rf "$PROFILE"' EXIT
          MARKET_SHOTS=market-qa-screens node prototypes/visualization-platform/market-screenshot.cjs
      - name: Upload rendered market chart screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-market-desktop-mobile-screens
          path: market-qa-screens/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload financial chart preview for visual inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-market-visual-qa
          path: prototypes/visualization-platform/dist/
          if-no-files-found: error
          retention-days: 4
