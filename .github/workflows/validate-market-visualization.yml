name: Validate researched financial visualization

on:
  pull_request:
    paths:
      - 'data/research/eia-brent-spot-2026-visual-candidate.json'
      - 'prototypes/visualization-platform/**'
      - '.github/workflows/validate-market-visualization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned build requirements
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
      - name: Install pinned visualization dependencies
        working-directory: prototypes/visualization-platform
        run: npm ci --ignore-scripts
      - name: Validate source facts and bundle the real-market prototype
        working-directory: prototypes/visualization-platform
        run: npm run build
      - name: Check compiled research artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s prototypes/visualization-platform/dist/prototypes/visualization-platform/index.html
          test -s prototypes/visualization-platform/dist/data/research/eia-brent-spot-2026-visual-candidate.json
          grep -q 'EXTERNAL_PRIMARY_SOURCE_RESEARCH_NOT_ACCEPTED_AS_CANONICAL' prototypes/visualization-platform/dist/data/research/eia-brent-spot-2026-visual-candidate.json
