name: Apply Phase 10 edge label patch

on:
  push:
    branches:
      - ux/phase10-visual-sweep-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/phase10-visual-sweep-20260907
      - name: Apply compact edge-label patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_phase10_edge_label_patch.py
          node --check js/public-ia.js
          node --check tests/browser-public-render-review.js
      - name: Commit durable repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_phase10_edge_label_patch.py .github/workflows/apply-phase10-edge-label-patch.yml
          git add js/public-ia.js tests/browser-public-render-review.js
          git commit -m 'Keep compact map labels inside viewport'
          git push origin HEAD:ux/phase10-visual-sweep-20260907
