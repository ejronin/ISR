name: Temporary R2 runtime inventory contract fix

on:
  push:
    branches:
      - release/r2-authoritative-reader-20260913

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[r2-inventory-fix-complete]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Align runtime inventory validator
        run: python scripts/r2_runtime_inventory_fix.py
      - name: Verify exact service-owner contract
        run: |
          grep -q 'authoritative visible reader registry and route lifecycle' scripts/validate_public_runtime_inventory.py
          grep -q 'non-authoritative base rendering library' scripts/validate_public_runtime_inventory.py
          grep -q 'non-authoritative reader projection support' scripts/validate_public_runtime_inventory.py
          ! grep -q 'public page registry and route ownership' scripts/validate_public_runtime_inventory.py
      - name: Commit contract fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_public_runtime_inventory.py
          git commit -m "Align R2 runtime inventory contract [r2-inventory-fix-complete]"
          git push origin HEAD:release/r2-authoritative-reader-20260913
