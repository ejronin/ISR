name: Historical audit - Wikipedia reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect compressed historical reconciliation payload
        run: python scripts/inspect_wiki_reconciliation.py
      - name: Materialize historical reconciliation products
        run: python scripts/materialize_wiki_reconciliation.py
      - name: Validate preserved evidence, coverage, chronology and ship-loss rules
        run: python scripts/validate_wiki_reconciliation.py
