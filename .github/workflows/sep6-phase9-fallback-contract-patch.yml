name: Sep 6 Phase 9 fallback contract patch (temporary)

on:
  push:
    branches:
      - update/sep6-evidence-20260906
    paths:
      - .github/workflows/sep6-phase9-fallback-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: update/sep6-evidence-20260906
          fetch-depth: 0
      - name: Update Phase 9 fallback grouping contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser-public-phase9.js')
          text = path.read_text()
          old = "assert.deepEqual(losses.groups, ['us-coalition', 'iran-aligned', 'civilian-commercial']);"
          new = "assert.deepEqual(losses.groups, ['us-coalition', 'iran-aligned', 'civilian-commercial', 'unclassified']);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy grouping assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check tests/browser-public-phase9.js
      - name: Commit contract repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name atlas-release-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-public-phase9.js
          git commit -m 'Qualify unclassified loss fallback in Phase 9 [sep6-phase9-fallback-contract]'
          git push origin HEAD:update/sep6-evidence-20260906
