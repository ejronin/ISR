name: Gate 3 evidence remediation validation

on:
  push:
    branches:
      - "gate3/**"
      - "fix/lie-ledger-semantic-contract-20260909"
      - "fix/gate3-v2-registration-20260909"
      - "fix/gate3-v2-temporal-contract-20260909"
  pull_request:
    paths:
      - "data/gate3/**"
      - "data/canonical-updates/UPD-20260905-GATE3-*.json"
      - "data/canonical-ledger/manifest-v2.json"
      - "data/forensic-v1.3.2/iranian-claim-evolution.json"
      - "data/lie-ledger-v2-rook-authority.json"
      - "docs/LIE_LEDGER_ANALYTICAL_AUTHORITY_AND_EVIDENCE_CONTRACT_20260909.md"
      - "docs/LIE_LEDGER_SUPERSEDED_RULE_REGISTRY_20260909.md"
      - "docs/gate3-v2-registration.md"
      - "schemas/canonical-*-v2.json"
      - "schemas/lie-ledger-v1.json"
      - "schemas/lie-ledger-v2.json"
      - "scripts/*gate3*.py"
      - "scripts/canonical_temporal_contract.py"
      - "scripts/build_canonical_current_state_v2*.py"
      - "scripts/build_public_current_state_v2*.py"
      - "scripts/build_lie_ledger_v2.py"
      - "scripts/validate_lie_ledger_v2.py"
      - "tests/gate3-v2-*.test.py"
      - "requirements-build.txt"

permissions:
  contents: read

jobs:
  validate-gate3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt; fi
          python -m pip check

      - name: Verify Gate 3 v2 registration and temporal authority
        run: |
          python scripts/gate3_v2_registration.py --verify
          python tests/gate3-v2-registration.test.py
          python tests/gate3-v2-temporal-contract.test.py
          python tests/gate3-v2-sep7-replay.test.py

      - name: Exercise Gate 3 v2 forward-update canaries
        run: |
          python tests/gate3-v2-forward-update-canary.test.py
          python tests/gate3-v2-delayed-knowledge-canary.test.py

      - name: Verify sealed v1 canonical baseline
        run: |
          python scripts/build_canonical_current_state.py --output data/canonical-current-state.json
          python scripts/validate_canonical_update_pipeline.py

      - name: Build final Gate 3 canonical state
        run: |
          python scripts/build_canonical_current_state_v2_final.py --output data/canonical-current-state-v2.json

      - name: Run final Gate 3 semantic validator
        run: |
          set -o pipefail
          python scripts/validate_gate3_final.py 2>&1 | tee gate3-validator.log

      - name: Build hardened Gate 3 public read model
        run: |
          python scripts/build_public_current_state_v2_hardened.py --output data/public-current-state-v2.json

      - name: Validate Lie Ledger v2 contract and metrics
        run: |
          set -o pipefail
          python scripts/validate_lie_ledger_v2.py 2>&1 | tee lie-ledger-v2-validator.log

      - name: Determinism checks
        run: |
          python scripts/gate3_v2_registration.py --verify
          python scripts/build_canonical_current_state_v2_final.py --check --output data/canonical-current-state-v2.json
          python scripts/build_public_current_state_v2_hardened.py --check --output data/public-current-state-v2.json

      - name: Upload Gate 3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-validation-diagnostics
          path: |
            gate3-validator.log
            lie-ledger-v2-validator.log
          if-no-files-found: ignore

      - name: Upload generated Gate 3 read models
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-read-models-hardened
          path: |
            data/canonical-current-state-v2.json
            data/public-current-state-v2.json
