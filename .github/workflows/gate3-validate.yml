name: Gate 3 evidence remediation validation

on:
  push:
    branches:
      - "gate3/**"
  pull_request:
    paths:
      - "data/gate3/**"
      - "data/canonical-updates/UPD-20260905-GATE3-*.json"
      - "data/canonical-ledger/manifest-v2.json"
      - "data/forensic-v1.3.2/iranian-claim-evolution.json"
      - "schemas/canonical-*-v2.json"
      - "schemas/lie-ledger-v1.json"
      - "scripts/*gate3*.py"
      - "scripts/build_canonical_current_state_v2.py"
      - "scripts/build_canonical_current_state_v2_hardened.py"
      - "scripts/build_public_current_state_v2.py"
      - "scripts/build_public_current_state_v2_hardened.py"

permissions:
  contents: read

jobs:
  validate-gate3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then python -m pip install -r requirements-build.txt; fi

      - name: Verify sealed v1 canonical baseline
        run: |
          python scripts/build_canonical_current_state.py --output data/canonical-current-state.json
          python scripts/validate_canonical_update_pipeline.py

      - name: Build hardened Gate 3 canonical state
        run: |
          python scripts/build_canonical_current_state_v2_hardened.py --output data/canonical-current-state-v2.json

      - name: Run Gate 3 semantic validator
        run: |
          python scripts/validate_gate3.py

      - name: Build hardened Gate 3 public read model
        run: |
          python scripts/build_public_current_state_v2_hardened.py --output data/public-current-state-v2.json

      - name: Determinism checks
        run: |
          python scripts/build_canonical_current_state_v2_hardened.py --check --output data/canonical-current-state-v2.json
          python scripts/build_public_current_state_v2_hardened.py --check --output data/public-current-state-v2.json

      - name: Upload generated Gate 3 read models
        uses: actions/upload-artifact@v4
        with:
          name: gate3-read-models-hardened
          path: |
            data/canonical-current-state-v2.json
            data/public-current-state-v2.json
