name: Temporary Issue 128 patch runner

on:
  push:
    branches:
      - release/issue-128-campaign-count-semantic

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue128-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/issue-128-campaign-count-semantic
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply bounded semantic-consumer migration
        run: |
          python - <<'PY'
          from pathlib import Path

          phase9 = Path('tests/browser-public-phase9.js')
          text = phase9.read_text()
          old_import = "const { assertLossRecordDenominator } = require('./public-copy-semantics.js');"
          new_import = """const {
            assertLossRecordDenominator,
            assertCampaignEventCountSemanticBoundary
          } = require('./public-copy-semantics.js');"""
          old_assert = "    assert.match(phase10Effects.drilldown, /Equipment quantities are not substituted for event counts/i, 'campaign totals lack an auditable constituent-count boundary');"
          new_assert = "    assertCampaignEventCountSemanticBoundary(phase10Effects.drilldown);"
          assert old_import in text, 'Phase 9 shared-helper import anchor missing'
          assert old_assert in text, 'Phase 9 retired literal assertion anchor missing'
          text = text.replace(old_import, new_import, 1).replace(old_assert, new_assert, 1)
          phase9.write_text(text)

          static = Path('tests/public-reader-layer.test.js')
          text = static.read_text()
          old_require = "const reader = require('../src/public-reader-layer.js');"
          new_require = old_require + "\nconst { assertCampaignEventCountSemanticBoundary } = require('./public-copy-semantics.js');"
          old_assert = "assert.match(readerSource, /Equipment quantities are not substituted for event counts/);"
          new_assert = """const campaignCountCopy = readerSource.match(/append\\(details, 'p', 'section-note', '([^']*count of recorded military events[^']*)'\\)/)?.[1] || '';
          assertCampaignEventCountSemanticBoundary(campaignCountCopy);"""
          assert old_require in text, 'static reader test require anchor missing'
          assert old_assert in text, 'static reader retired literal assertion anchor missing'
          text = text.replace(old_require, new_require, 1).replace(old_assert, new_assert, 1)
          static.write_text(text)
          PY

          node --check tests/public-copy-semantics.js
          node --check tests/browser-public-evidence-phase5.js
          node --check tests/browser-public-phase9.js
          node --check tests/public-reader-layer.test.js
          node -e "const h=require('./tests/public-copy-semantics.js'); h.runLossRecordDenominatorFixtures(); h.runCampaignEventCountSemanticBoundaryFixtures();"
          node tests/public-reader-layer.test.js

          test "$(grep -RFl --include='*.js' 'Equipment quantities are not substituted for event counts' tests | tr '\n' ' ')" = "tests/public-copy-semantics.js "
          test "$(grep -RFl --include='browser-public-*.js' 'function assertCampaignEventCountSemanticBoundary' tests | wc -l)" -eq 0

      - name: Commit patch and remove temporary runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue128-patch.yml
          git add tests/public-copy-semantics.js tests/browser-public-evidence-phase5.js tests/browser-public-phase9.js tests/public-reader-layer.test.js
          git commit -m 'Release: migrate Campaign semantic consumers [issue128-patched]'
          git push origin HEAD:release/issue-128-campaign-count-semantic
