name: Temporary R2 asserted rewrite

on:
  push:
    branches:
      - release/r2-authoritative-reader-20260913

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[r2-rewrite-complete]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply asserted R2 rewrite
        run: |
          python scripts/r2_rewrite.py
          # The GitHub Actions token may not update workflow files. The permanent
          # qualification workflow is patched through the Release connector after
          # this source rewrite lands.
          git checkout HEAD -- .github/workflows/release-qualification.yml
      - name: Syntax-check new authority boundary
        run: |
          node --check src/public-reader-registry.js
          node --check tests/public-reader-registry.test.js
          python -m py_compile scripts/build_public_release_core.py scripts/validate_public_deployment.py
      - name: Commit rewrite
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R2 authoritative reader migration [r2-rewrite-complete]"
          git push origin HEAD:release/r2-authoritative-reader-20260913
