name: Validate current public foundation

on:
  push:
    branches:
      - "release/**"
    paths:
      - "scripts/public_read_model_current_foundation.py"
      - "scripts/build_public_current_state_v2.py"
      - "scripts/build_public_current_state_v2_hardened.py"
      - "scripts/build_current_release_state.py"
      - "scripts/validate_public_current_state_v2.py"
      - "tests/public-read-model-foundation-parity.test.py"
      - "tests/current-release-state-orchestration.test.py"
      - "docs/public-current-state.md"
      - ".github/workflows/validate-current-public-foundation.yml"
  pull_request:
    paths:
      - "scripts/public_read_model_current_foundation.py"
      - "scripts/build_public_current_state_v2.py"
      - "scripts/build_public_current_state_v2_hardened.py"
      - "scripts/build_current_release_state.py"
      - "scripts/validate_public_current_state_v2.py"
      - "tests/public-read-model-foundation-parity.test.py"
      - "tests/current-release-state-orchestration.test.py"
      - "docs/public-current-state.md"
      - ".github/workflows/validate-current-public-foundation.yml"

permissions:
  contents: read

jobs:
  current-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned validation requirements
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
          python -m pip check
      - name: Compile current foundation and release path
        run: |
          python -m py_compile scripts/public_read_model_current_foundation.py
          python -m py_compile scripts/build_public_current_state_v2.py
          python -m py_compile scripts/build_public_current_state_v2_hardened.py
          python -m py_compile scripts/build_current_release_state.py
          python -m py_compile scripts/validate_public_current_state_v2.py
          python -m py_compile tests/public-read-model-foundation-parity.test.py
          python -m py_compile tests/current-release-state-orchestration.test.py
      - name: Build source registry and current-v2 release state
        run: |
          python scripts/build_source_registry.py --root .
          python scripts/build_current_release_state.py
          python scripts/build_current_release_state.py --check
      - name: Prove compatibility-to-current semantic parity
        run: python tests/public-read-model-foundation-parity.test.py
      - name: Prove v2-only release orchestration
        run: python tests/current-release-state-orchestration.test.py
      - name: Reject historical public-v1 inputs from current production
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('scripts/build_public_current_state_v2.py').read_text(encoding='utf-8')
          hardened = Path('scripts/build_public_current_state_v2_hardened.py').read_text(encoding='utf-8')
          foundation = Path('scripts/public_read_model_current_foundation.py').read_text(encoding='utf-8')
          orchestrator = Path('scripts/build_current_release_state.py').read_text(encoding='utf-8')

          forbidden_core = (
              'build_compatibility_foundation',
              'CANONICAL_V1',
              'data/canonical-current-state.json',
              'public_read_model_foundation as foundation',
          )
          for token in forbidden_core:
              if token in core:
                  raise SystemExit(f'current public core retained compatibility dependency: {token}')
          for token in (
              'scripts/build_public_current_state.py',
              'schemas/public-current-state-v1.json',
              'LEGACY_GENERATOR_PATH',
          ):
              if token in foundation:
                  raise SystemExit(f'current foundation retained public-v1 dependency: {token}')
          if 'scripts/public_read_model_current_foundation.py' not in hardened:
              raise SystemExit('hardened public builder does not pin current foundation input')

          build_block = orchestrator.split('CHECK_COMMANDS:', 1)[0]
          for token in (
              'command("scripts/build_canonical_current_state.py")',
              'command("scripts/validate_canonical_authority.py")',
              'command("scripts/validate_canonical_update_pipeline.py")',
          ):
              if token in build_block:
                  raise SystemExit(f'default release build retained historical step: {token}')
          if 'HISTORICAL_AUDIT_COMMANDS' not in orchestrator:
              raise SystemExit('historical canonical audit path was not preserved explicitly')
          print('current public foundation source boundary: PASS')
          PY
