name: Temporary browser claim-count contract repair

on:
  push:
    branches:
      - release/claim-browser-count-contract-20260913
    paths:
      - .github/workflows/tmp-fix-claim-browser-count.yml
      - scripts/tmp_fix_claim_browser_count.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/claim-browser-count-contract-20260913
      - name: Apply asserted test-contract repair
        run: python scripts/tmp_fix_claim_browser_count.py
      - name: Syntax check
        run: node --check tests/browser-public-ia-smoke.js
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser-public-ia-smoke.js
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "Release: make browser claim count data-driven"
          git push origin HEAD:release/claim-browser-count-contract-20260913
