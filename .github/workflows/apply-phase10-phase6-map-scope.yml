name: Apply Phase 10 Phase 6 map scope repair

on:
  push:
    branches:
      - ux/phase10-visual-sweep-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/phase10-visual-sweep-20260907
      - name: Apply Phase 6 route-card scope repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_phase10_phase6_map_scope_patch.py
          node --check tests/browser-public-map-phase6.js
      - name: Commit durable test-contract repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_phase10_phase6_map_scope_patch.py .github/workflows/apply-phase10-phase6-map-scope.yml
          git add tests/browser-public-map-phase6.js
          git commit -m 'Scope Phase 6 route interaction to owning map'
          git push origin HEAD:ux/phase10-visual-sweep-20260907
