name: Patch CI convergence once

on:
  push:
    branches:
      - release/consolidate-ci-invariants-20260911
    paths:
      - ".github/workflows/patch-ci-convergence-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/consolidate-ci-invariants-20260911
      - name: Fold transition checks into durable primary qualification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''          python tests/gate3-packet-hash-portability.test.py\n          python scripts/build_public_release.py\n''',
                  '''          python tests/gate3-packet-hash-portability.test.py\n          python scripts/migrate_lie_ledger_evidence_adjudications.py --check\n          python tests/lie-ledger-governance-neutralization.test.py\n          python scripts/build_public_release.py\n''',
              ),
              (
                  '''          node --check js/public-ia.js\n          node --check tests/browser-public-boot-smoke.js\n''',
                  '''          node --check js/public-ia.js\n          node --check src/public-reader-layer.js\n          node --check tests/browser-public-boot-smoke.js\n          node --check tests/browser-public-final-polish.js\n          node --check tests/browser-public-render-review.js\n''',
              ),
              (
                  '''          node tests/ui-endgame-mermaid-r1.test.js\n''',
                  '''          node tests/ui-endgame-mermaid-r1.test.js\n          node tests/public-reader-layer.test.js\n          node tests/public-final-polish.test.js\n          python tests/neutral-current-narrative.test.py\n''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one validate.yml target; found {text.count(old)} for {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          for retired in (
              '.github/workflows/validate-aug25-late.yml',
              '.github/workflows/validate-current-public-foundation.yml',
              '.github/workflows/validate-reader-rearchitecture.yml',
          ):
              target = Path(retired)
              if not target.is_file():
                  raise SystemExit(f'expected transition workflow is missing: {retired}')
              target.unlink()

          doc = Path('docs/release-qualification.md')
          doc.write_text('''# Atlas current release qualification\n\n## Mission anchor\n\nAtlas is a public, source-linked record of the 2026 Iran war. Release machinery exists to protect the reader hierarchy defined in `docs/ENGINEERING_DOCTRINE.md`: what happened, where it stands now, why Atlas can say it, and deeper evidence when wanted. CI does not own factual or editorial authority.\n\n## Active qualification paths\n\n### Primary current-product qualification — `.github/workflows/validate.yml`\n\nThis is the comprehensive PR and `main` qualification path. It builds the current canonical-v2/public-v2 state, proves deterministic release assembly, checks source and evidence integrity, runs neutral Lie Ledger parity, validates reader behavior and browser paths, verifies the closed Pages artifact, and retains historical fixture tests only where they still protect a live evidence or behavioral invariant.\n\nA historical test name does not make that test authoritative. Tests remain only for the invariant they protect.\n\n### Evidence/canonical focused qualification — `.github/workflows/gate3-validate.yml`\n\nThis is a focused evidence/canonical lane while its remaining Gate 3 naming is migrated. It must not become an alternate production builder. Historical compatibility may be inspected only as bounded migration evidence.\n\n### Reader browser review — `.github/workflows/validate-source-humanization.yml`\n\nThis retains the full-stack browser/source-humanization checks and rendered screenshot artifact because those provide independent reader-facing regression evidence not supplied by static tests alone.\n\n### Deployment — `.github/workflows/pages.yml`\n\nPages builds and publishes only the manifest-authorized closed artifact and binds deployment identity to the exact `main` SHA.\n\n### Historical reconciliation audit — `.github/workflows/inspect-wiki-reconciliation.yml`\n\nThis workflow is historical reconciliation support. It is not a current production authority and should be narrowed to explicit audit use as the remaining CI convergence proceeds.\n\n## Retired transition workflows\n\nThe following standalone workflows were removed after their unique protections were moved into the primary current-product qualification:\n\n- `validate-aug25-late.yml` — its overlay and deployment-identity checks already run in `validate.yml`;\n- `validate-current-public-foundation.yml` — PR #95 migration parity and v2-only orchestration are protected by durable tests in the primary suite;\n- `validate-reader-rearchitecture.yml` — reader-layer, privileged-narrative retirement, syntax, and public-final-polish checks now run in the primary suite, while rendered browser review remains in the dedicated reader workflow.\n\n## Non-negotiable release invariants\n\nNever trade green CI for weaker evidence. Preserve accepted evidence bytes/hashes, source variants, temporal/knowledge distinctions, stable IDs, unknown-vs-zero, denominator integrity, False != Lie, canonical/public semantic fidelity, accessibility, deterministic generation, content addressing, closed-artifact enforcement, and exact-head deployment identity.\n''', encoding='utf-8', newline='\n')
          PY
      - name: Commit convergence slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate transition CI into durable release qualification"
          git push origin HEAD:release/consolidate-ci-invariants-20260911
