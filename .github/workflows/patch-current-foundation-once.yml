name: Patch current foundation once

on:
  push:
    branches:
      - release/neutral-public-foundation-20260911
    paths:
      - ".github/workflows/patch-current-foundation-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/neutral-public-foundation-20260911
      - name: Preserve accepted current-entity dataset role
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/public_read_model_current_foundation.py')
          text = path.read_text(encoding='utf-8')
          old = '''            "DERIVED_GATE3_CANONICAL_CURRENT_STATE",\n            copy.deepcopy(payload),\n            "application/json",\n        )\n\n    consumer_coverage = validate_consumer_coverage_config('''
          new = '''            "DERIVED_CANONICAL_CURRENT_ENTITY_STATE",\n            copy.deepcopy(payload),\n            "application/json",\n        )\n\n    consumer_coverage = validate_consumer_coverage_config('''
          if text.count(old) != 1:
              raise SystemExit(f'expected one current-entity role target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python -m py_compile scripts/public_read_model_current_foundation.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/public_read_model_current_foundation.py
          git commit -m "Preserve current entity dataset role in new foundation"
          git push origin HEAD:release/neutral-public-foundation-20260911
