name: Temporary PR62 registrar replay

on:
  push:
    branches:
      - "tmp/pr62-registration-replay-20260910"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install closed build environment
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt
          python -m pip check
      - name: Add reviewed acceptance state to replay packets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('data/canonical-updates/UPD-20260907-CATCHUP.json'),
              Path('data/canonical-updates/UPD-20260908-CATCHUP.json'),
              Path('data/canonical-updates/UPD-20260909-CATCHUP.json'),
          ]
          for path in paths:
              value = json.loads(path.read_text(encoding='utf-8'))
              if value.get('status') not in (None, 'ACCEPTED'):
                  raise SystemExit(f'unexpected preexisting status for {path}: {value.get("status")}')
              value['status'] = 'ACCEPTED'
              path.write_text(json.dumps(value, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Register Sep. 7 through Sep. 9 through production authority
        run: |
          python scripts/gate3_v2_registration.py --verify
          python scripts/gate3_v2_registration.py --register data/canonical-updates/UPD-20260907-CATCHUP.json
          python scripts/gate3_v2_registration.py --register data/canonical-updates/UPD-20260908-CATCHUP.json
          python scripts/gate3_v2_registration.py --register data/canonical-updates/UPD-20260909-CATCHUP.json
          python scripts/gate3_v2_registration.py --verify
      - name: Verify production consumer accepts registered lineage
        run: |
          python scripts/build_canonical_current_state_v2_final.py --output data/canonical-current-state-v2.json
          python scripts/validate_gate3_final.py
      - name: Upload registrar-produced replay authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr62-registered-lineage
          path: |
            data/canonical-ledger/manifest-v2.json
            data/canonical-updates/UPD-20260907-CATCHUP.json
            data/canonical-updates/UPD-20260908-CATCHUP.json
            data/canonical-updates/UPD-20260909-CATCHUP.json
          if-no-files-found: error
          retention-days: 2
