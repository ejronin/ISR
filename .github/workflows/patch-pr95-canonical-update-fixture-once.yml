name: Patch PR95 canonical update fixture once

on:
  push:
    branches:
      - release/neutral-public-foundation-20260911
    paths:
      - ".github/workflows/patch-pr95-canonical-update-fixture-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/neutral-public-foundation-20260911
      - name: Make historical mutation fixture self-contained
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/canonical-update-pipeline.test.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def test_g_invalid_update_fails_without_modifying_current_state(self) -> None:\n        artifact = ROOT / compiler.DEFAULT_OUTPUT\n        before = hashlib.sha256(artifact.read_bytes()).hexdigest()'''
          new = '''    def test_g_invalid_update_fails_without_modifying_current_state(self) -> None:\n        artifact = ROOT / compiler.DEFAULT_OUTPUT\n        # The current release path no longer generates canonical-v1. This test\n        # exercises the historical canonical-v1 compiler directly, so create its\n        # comparison artifact explicitly rather than depending on release-order\n        # side effects. Restore any pre-existing bytes when the fixture completes.\n        existed = artifact.exists()\n        prior = artifact.read_bytes() if existed else None\n        baseline, _ = compiler.build_state(ROOT)\n        artifact.write_bytes(compiler.canonical_json_bytes(baseline))\n        self.addCleanup(lambda: artifact.write_bytes(prior) if existed and prior is not None else artifact.unlink(missing_ok=True))\n        before = hashlib.sha256(artifact.read_bytes()).hexdigest()'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one canonical-update fixture target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python -m py_compile tests/canonical-update-pipeline.test.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/canonical-update-pipeline.test.py
          git commit -m "Make canonical v1 mutation fixture self-contained"
          git push origin HEAD:release/neutral-public-foundation-20260911
