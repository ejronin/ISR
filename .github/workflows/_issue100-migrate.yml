name: Issue 100 renderer convergence transform

on:
  push:
    branches:
      - public/100-authoritative-reader-renderer-20260916

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[issue100-transform]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: public/100-authoritative-reader-renderer-20260916
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply architecture convergence
        run: |
          python scripts/_issue100_migrate.py
          sed -i "1c'use strict';" tests/public-reader-registry.test.js
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/public-reader-registry.test.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const documentObject={title,body,documentElement:body,createElement:t=>new Node(t)};", "const documentObject={title,body,documentElement:body};documentObject.createElement=t=>{const n=new Node(t);n.ownerDocument=documentObject;return n;};body.ownerDocument=documentObject;")
          s = s.replace("const nav=doc=>new Node('nav');", "const nav=doc=>doc.createElement('nav');")
          s = s.replace("const app=new Node('div');app.dataset.kind='app';const primaryHost=new Node(),mobileHost=new Node(),aside=new Node(),main=new Node(),footer=new Node();", "const app=doc.createElement('div');app.dataset.kind='app';const primaryHost=doc.createElement('div'),mobileHost=doc.createElement('div'),aside=doc.createElement('aside'),main=doc.createElement('main'),footer=doc.createElement('footer');")
          s = s.replace("TestPage(){const article=new Node('article');article.dataset.kind='page';const intro=new Node('div');", "TestPage(context){const article=context.documentObject.createElement('article');article.dataset.kind='page';const intro=context.documentObject.createElement('div');")
          s = s.replace("if(includeHeading)article.append(new Node('h1'));", "if(includeHeading)article.append(context.documentObject.createElement('h1'));")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run focused architecture contracts
        run: |
          node tests/public-reader-layer.test.js
          node tests/public-reader-registry.test.js
          python scripts/validate_public_runtime_inventory.py
      - name: Commit converged renderer
        run: |
          rm -f scripts/_issue100_migrate.py .github/workflows/_issue100-migrate.yml .github/workflows/_issue100-migrate-fix.yml
          git config user.name "Atlas Public Architecture"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --check
          git commit -m "Public: converge authoritative reader renderer [issue100-transform]"
          git push origin HEAD:public/100-authoritative-reader-renderer-20260916
