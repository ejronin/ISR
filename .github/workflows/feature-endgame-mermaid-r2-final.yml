name: Feature Endgame Mermaid R2 final validation
on:
  push:
    branches: [ui-endgame-mermaid-r2]
permissions:
  contents: read
jobs:
  validate-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax check
        run: node --check js/endgame-mermaid-r2.js
      - name: Existing deterministic test
        run: node tests/ui-endgame-mermaid-r1.test.js
      - name: Existing release validator
        run: python scripts/validate_ui_endgame_mermaid_r1.py
      - name: R2 topology gates
        run: |
          grep -q "endgame-mermaid-r2.js" js/endgame-20260823.js
          grep -q "structured-adjudication-r2" js/endgame-mermaid-r2.js
          grep -q "MIXED DIMENSIONS" js/endgame-mermaid-r2.js
          grep -q "curve:'basis'" js/endgame-mermaid-r2.js
          grep -q "ORIGINAL IRANIAN CONDITIONS" js/endgame-mermaid-r2.js
          grep -q "CURRENT DISPOSITION" js/endgame-mermaid-r2.js
          git diff --check 27c87d9bc699af3f2f49329af32ebf6c95b806ed HEAD
