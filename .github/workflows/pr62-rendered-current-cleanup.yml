name: PR62 rendered-current fossil cleanup

on:
  push:
    branches:
      - "rook/catchup-20260909"
    paths:
      - ".github/workflows/pr62-rendered-current-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repair rendered current-count assertion and guard coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          browser = Path("tests/browser-public-ia-smoke.js")
          text = browser.read_text(encoding="utf-8")
          old = "    assert.match(losses, /57\\\\s+material-loss records/);\n"
          new = "    const expectedMaterialLossRecords = await cdp.eval(`fetch('./data/public-current-state.json', { cache: 'no-store' }).then(response => response.json()).then(model => model.counts.material_loss_records)`);\n    assert.match(losses, new RegExp(`${expectedMaterialLossRecords}\\\\s+material-loss records`));\n"
          if text.count(old) != 1:
              raise SystemExit("browser mutable-current insertion point not found exactly once")
          browser.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          guard = Path("tests/gate3-v2-mutable-current-invariants.test.py")
          text = guard.read_text(encoding="utf-8")
          marker = '''GATE3_RECORD_LITERAL = re.compile(\n    r"assert\\.(?:equal|strictEqual)\\(\\s*records\\(['\\\"]gate3\\.[^'\\\"]+['\\\"]\\)\\.length\\s*,\\s*\\d+"\n)\n'''
          insertion = marker + '''RENDERED_CURRENT_COUNT_LITERAL = re.compile(\n    r"assert\\.match\\([^,\\n]+,\\s*/\\d+\\\\s\\+(?:material-loss records|event-level casualty records|chronology records|conflict days)/"\n)\n'''
          if text.count(marker) != 1:
              raise SystemExit("guard pattern insertion point not found exactly once")
          text = text.replace(marker, insertion, 1)
          scan_marker = '''        if public_current_consumer and GATE3_RECORD_LITERAL.search(line):\n            reasons.append("current Gate 3 dataset population pinned to a literal")\n'''
          scan_insertion = scan_marker + '''        if public_current_consumer and RENDERED_CURRENT_COUNT_LITERAL.search(line):\n            reasons.append("rendered current-state population pinned to a literal")\n'''
          if text.count(scan_marker) != 1:
              raise SystemExit("guard scan insertion point not found exactly once")
          guard.write_text(text.replace(scan_marker, scan_insertion, 1), encoding="utf-8", newline="\n")
          PY

          python tests/gate3-v2-mutable-current-invariants.test.py
          node --check tests/browser-public-ia-smoke.js
          git diff --check

      - name: Commit cleanup and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser-public-ia-smoke.js tests/gate3-v2-mutable-current-invariants.test.py
          git commit -m "Derive rendered material-loss count from current state"
          git rm .github/workflows/pr62-rendered-current-cleanup.yml
          git commit -m "Remove temporary rendered-current cleanup workflow"
          git push origin HEAD:rook/catchup-20260909
