name: PR62 production registrar replay

on:
  push:
    branches:
      - "rook/catchup-20260909"
    paths:
      - ".github/workflows/pr62-production-replay-20260909.yml"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then python -m pip install --disable-pip-version-check --no-deps -r requirements-build.txt; fi
          python -m pip check

      - name: Restore approved catch-up delta from frozen backup
        run: |
          set -euo pipefail
          git fetch origin tmp/pr62-pre-replay-1b4e3fb5
          git checkout origin/tmp/pr62-pre-replay-1b4e3fb5 -- \
            config/rook-narrative-current.json \
            data/lie-ledger-v2-rook-current-claims-20260909.json \
            js/public-app.js \
            scripts/apply_lie_ledger_current_claims_20260909.py \
            scripts/build_canonical_current_state_v2_final.py \
            scripts/build_public_current_state_v2_hardened.py \
            scripts/validate_gate3.py \
            tests/public-boot.test.js \
            tests/public-content-redesign.test.js \
            tests/public-loss-actor-batch2.test.js \
            tests/public-parity-batch3.test.js \
            tests/sep6-update-v2.test.py \
            data/canonical-updates/UPD-20260907-CATCHUP.json \
            data/canonical-updates/UPD-20260908-CATCHUP.json \
            data/canonical-updates/UPD-20260909-CATCHUP.json

          python - <<'PY'
          import json
          from pathlib import Path

          for name in (
              "UPD-20260907-CATCHUP.json",
              "UPD-20260908-CATCHUP.json",
              "UPD-20260909-CATCHUP.json",
          ):
              path = Path("data/canonical-updates") / name
              packet = json.loads(path.read_text(encoding="utf-8"))
              packet["status"] = "ACCEPTED"
              path.write_text(json.dumps(packet, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8", newline="\n")

          path = Path("scripts/build_canonical_current_state_v2.py")
          text = path.read_text(encoding="utf-8")
          needle = '''            item=wrap(eid,ent["record"],{"kind":"GATE3_ACCEPTED_PACKET","packet_id":p["packet_id"]})\n            if et=="material_loss":\n'''
          replacement = '''            item=wrap(eid,ent["record"],{"kind":"GATE3_ACCEPTED_PACKET","packet_id":p["packet_id"]})\n            if et=="casualty":\n                record=item["record"]; ref=record.get("event_ref")\n                if ref:\n                    if ref not in {x["event_id"] for x in state["chronology"]}: raise ValueError(f"casualty event link does not resolve {eid} -> {ref}")\n                    disposition={"disposition":"EVENT_LINK","canonical_event_ref":ref,"additive":str(record.get("aggregation_type") or "").upper()!="CUMULATIVE_SNAPSHOT"}\n                elif str(record.get("aggregation_type") or "").upper()=="CUMULATIVE_SNAPSHOT" or record.get("cumulative_snapshot"):\n                    disposition={"disposition":"AGGREGATE_SNAPSHOT","additive":False}\n                else:\n                    disposition={"disposition":"NON_EVENT_OR_AGGREGATE","reason":"No canonical event link is established for this accepted casualty observation.","additive":False}\n                item["semantic_disposition"]=disposition\n                sld=f"SLD-{re.sub(r'[^A-Z0-9-]+','-',str(eid).upper())}"\n                state["entities"].setdefault("side_ledger_dispositions",[]).append(wrap(sld,{"side_ledger_disposition_id":sld,"side_record_id":eid,"side_collection":"casualties",**copy.deepcopy(disposition)},{"kind":"GATE3_ACCEPTED_PACKET_SIDE_LEDGER_RECONCILIATION","packet_id":p["packet_id"]}))\n            if et=="material_loss":\n'''
          if needle not in text:
              raise SystemExit("casualty merge insertion point not found in repaired builder")
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          grep -F 'import canonical_temporal_contract as temporal' scripts/build_canonical_current_state_v2.py
          grep -F 'temporal.validate_packet_against_accepted_entry' scripts/build_canonical_current_state_v2.py
          grep -F 'temporal.validate_event_temporal_semantics' scripts/build_canonical_current_state_v2.py
          git diff --check

      - name: Commit replay inputs before registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/rook-narrative-current.json \
            data/lie-ledger-v2-rook-current-claims-20260909.json \
            js/public-app.js \
            scripts/apply_lie_ledger_current_claims_20260909.py \
            scripts/build_canonical_current_state_v2.py \
            scripts/build_canonical_current_state_v2_final.py \
            scripts/build_public_current_state_v2_hardened.py \
            scripts/validate_gate3.py \
            tests/public-boot.test.js \
            tests/public-content-redesign.test.js \
            tests/public-loss-actor-batch2.test.js \
            tests/public-parity-batch3.test.js \
            tests/sep6-update-v2.test.py \
            data/canonical-updates/UPD-20260907-CATCHUP.json \
            data/canonical-updates/UPD-20260908-CATCHUP.json \
            data/canonical-updates/UPD-20260909-CATCHUP.json
          git commit -m "Replay Sep 7-9 catch-up on repaired temporal main"

      - name: Register Sep 7, 8 and 9 through production authority
        run: |
          set -euo pipefail
          python scripts/gate3_v2_registration.py --verify
          python scripts/gate3_v2_registration.py --register data/canonical-updates/UPD-20260907-CATCHUP.json
          python scripts/gate3_v2_registration.py --register data/canonical-updates/UPD-20260908-CATCHUP.json
          python scripts/gate3_v2_registration.py --register data/canonical-updates/UPD-20260909-CATCHUP.json
          python scripts/gate3_v2_registration.py --verify
          python tests/gate3-v2-forward-update-canary.test.py

      - name: Qualify registered current state before push
        run: |
          set -euo pipefail
          python scripts/build_canonical_current_state_v2_final.py --output /tmp/canonical-current-state-v2.json
          python scripts/build_public_current_state_v2_hardened.py --output /tmp/public-current-state-v2.json
          python scripts/validate_gate3_final.py
          python scripts/validate_lie_ledger_v2.py
          python tests/sep6-update-v2.test.py

      - name: Commit authoritative manifest and remove replay helper
        run: |
          set -euo pipefail
          git add data/canonical-ledger/manifest-v2.json
          git commit -m "Register Sep 7-9 catch-up through Gate 3 v2 registrar"
          git rm .github/workflows/pr62-production-replay-20260909.yml
          git commit -m "Remove temporary PR62 registrar replay workflow"
          git push origin HEAD:rook/catchup-20260909
