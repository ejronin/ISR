name: Sep 6 evidence bootstrap (temporary)

on:
  push:
    branches:
      - update/sep6-evidence-20260906

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sep6-bootstrap-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Apply canonical Sep. 6 update
        env:
          PYTHONUTF8: '1'
        run: python scripts/sep6_bootstrap_apply.py
      - name: Commit generated update
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/gate3-validate.yml .github/workflows/validate.yml
          git config user.name 'atlas-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Apply Sep. 6 canonical evidence update [sep6-bootstrap-applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
