name: ROOK standing-source availability probe

on:
  # On a qualified workflow change merged into main, run one immediate maintenance probe.
  # Only the source probe workflow/code/tests trigger the probe on push; data/ and public changes do not.
  push:
    branches: [main]
    paths:
      - '.github/workflows/rook-standing-source-probe.yml'
      - 'scripts/rook_source_probe.py'
      - 'tests/test_rook_source_probe.py'
  schedule:
    # Both DST offsets; Python resolves the last completed 00:00 / 12:00
    # America/New_York evidence window and safely skips duplicate path writes.
    - cron: '15 4,5,16,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rook-standing-source-probe
  cancel-in-progress: false

jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate probe logic without network
        run: python tests/test_rook_source_probe.py
      - name: Contact standing public sources and record unverified link leads
        id: collect
        run: python scripts/rook_source_probe.py
      - name: Preserve source availability branch and refer to Evidence Integration
        id: propose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add data/evidence-integration/rook-source-registry-delta-*.json
          if git diff --cached --quiet; then
            echo 'Source availability report already accepted on main. No new PR required.'
            exit 0
          fi
          file="$(git diff --cached --name-only | grep -E '^data/evidence-integration/rook-source-registry-delta-[0-9]{8}T[0-9]{4}ET-automated\.json$' | head -n 1)"
          test -n "$file"
          branch="rook/${file##*/}"
          branch="${branch%.json}"
          echo "Proposing append-only source availability: $file via $branch"
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "Existing durable proposal branch $branch; will not overwrite or duplicate."
            gh issue comment 296 --body "ROOK source availability remains on branch $branch; report $file. Run https://github.com/ejronin/ISR/actions/runs/${{ github.run_id }}. GitHub-app PR review pending; no full-sweep qualification implied."
            exit 0
          fi
          git config user.name 'atlas-rook-source-probe[bot]'
          git config user.email 'atlas-rook-source-probe[bot]@users.noreply.github.com'
          git commit -m "rook: propose append-only standing-source availability"
          git branch "$branch"
          git push origin "HEAD:refs/heads/$branch"
          # GITHUB_TOKEN cannot open PRs under this repository security setting.
          # Leave the source branch durable and route it to Evidence Integration.
          # The authorized GitHub app opens the protected PR; never weaken protection.
          gh issue comment 296 --body "ROOK source availability ready for protected PR review. Branch: $branch. File: $file. Run: https://github.com/ejronin/ISR/actions/runs/${{ github.run_id }}. FETCH ONLY, not a completed full-theater sweep or accepted evidence. Evidence Integration must open a PR through the GitHub app, require exact-head CI, and merge only through the existing protection."
          echo "Durable source branch written: $branch. GitHub-app PR handoff pending."
      - name: Upload bounded source probe result for failure recovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rook-source-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/evidence-integration/rook-source-registry-delta-*-automated.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report probe failure without inventing collection completion
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 296 --body "ROOK standing-source availability probe failed for workflow run ${{ github.run_id }}. See job logs. No full sweep, event verification or canonical evidence acceptance is implied."
