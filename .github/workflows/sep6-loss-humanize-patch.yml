name: Sep 6 loss humanization patch (temporary)

on:
  push:
    branches:
      - update/sep6-evidence-20260906

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sep6-loss-humanize-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Humanize loss side labels without mutating raw identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('js/public-ia.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("kicker: `${record.side || 'Side unresolved'} · ${plainLabel(record.status, 'Physical state unresolved')}`", "kicker: `${publicNarrative(record.side, 'Side unresolved')} · ${plainLabel(record.status, 'Physical state unresolved')}`"),
              ("const merchantLosses = materialLosses.filter(record => record.side === 'CIVILIAN/COMMERCIAL');", "const merchantLosses = materialLosses.filter(record => record.side === 'CIVILIAN/COMMERCIAL' || String(record.side || '').includes('COMMERCIAL'));")
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          node --check js/public-ia.js
          git diff --check
      - name: Commit humanization fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'atlas-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/public-ia.js
          git diff --cached --check
          git commit -m 'Humanize commercial loss side taxonomy [sep6-loss-humanize-applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
