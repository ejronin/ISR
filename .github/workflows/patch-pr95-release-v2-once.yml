name: Patch PR95 stale release dependencies once

on:
  push:
    branches:
      - release/neutral-public-foundation-20260911
    paths:
      - ".github/workflows/patch-pr95-release-v2-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/neutral-public-foundation-20260911
      - name: Patch historical fixture and deployment identity to current v2
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/canonical-authority.test.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''            artifact = root / compiler.DEFAULT_OUTPUT\n            artifact_before = artifact.read_bytes()\n            packet_a = source_packet'''
          new = '''            artifact = root / compiler.DEFAULT_OUTPUT\n            # This is a historical canonical-v1 transaction fixture. Current release\n            # assembly no longer materializes the v1 artifact as a side effect, so\n            # the fixture must create its own baseline explicitly before testing\n            # that failed registration leaves the artifact untouched.\n            baseline_state, _ = compiler.build_state(root)\n            artifact.write_bytes(compiler.canonical_json_bytes(baseline_state))\n            artifact_before = artifact.read_bytes()\n            packet_a = source_packet'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one canonical-authority fixture target, found {text.count(old)}')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          build_info = Path('scripts/write_build_info.py')
          text = build_info.read_text(encoding='utf-8')
          text = text.replace(
              '"""Write machine-readable deployment identity from canonical current state."""',
              '"""Write machine-readable deployment identity from current canonical-v2 state."""',
              1,
          )
          old = '''    canonical_path = root / "data/canonical-current-state.json"\n    if not canonical_path.is_file():\n        raise SystemExit("canonical current state is missing; run build_canonical_current_state.py first")\n    canonical = json.loads(canonical_path.read_text(encoding="utf-8"))\n    if canonical.get("artifact_role") != "DERIVED_CANONICAL_CURRENT_ENTITY_STATE":\n        raise SystemExit("canonical current-state artifact role is invalid")'''
          new = '''    canonical_path = root / "data/canonical-current-state-v2.json"\n    if not canonical_path.is_file():\n        raise SystemExit("canonical-v2 current state is missing; run build_current_release_state.py first")\n    canonical = json.loads(canonical_path.read_text(encoding="utf-8"))\n    if canonical.get("schema_version") != "2.0" or not canonical.get("release", {}).get("canonical_state_identity_v2"):\n        raise SystemExit("canonical-v2 current-state identity is invalid")'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one build-info canonical target, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''        "canonical_state_identity": canonical["release"]["canonical_state_identity"],\n        "canonical_state_sha256": file_hash(canonical_path),'''
          new = '''        # Keep the inherited v1 identity as migration lineage while binding\n        # deployment identity to the active canonical-v2 artifact.\n        "canonical_state_identity": canonical["release"]["canonical_state_identity"],\n        "canonical_state_identity_v2": canonical["release"]["canonical_state_identity_v2"],\n        "canonical_state_sha256": file_hash(canonical_path),'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one build-info identity target, found {text.count(old)}')
          build_info.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          validator = Path('scripts/validate_build_info_current.py')
          text = validator.read_text(encoding='utf-8')
          text = text.replace(
              '"""Validate deployment identity against generated canonical current state."""',
              '"""Validate deployment identity against generated canonical-v2 current state."""',
              1,
          )
          old = '''CANONICAL_PATH = ROOT / "data/canonical-current-state.json"'''
          new = '''CANONICAL_PATH = ROOT / "data/canonical-current-state-v2.json"'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one build-info validator path target, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''assert payload["current_layer"] == "data/canonical-current-state.json"\nassert "\\\\" not in payload["current_layer"], "build-info repository paths must be platform-independent POSIX text"\nassert payload["canonical_state_identity"] == canonical["release"]["canonical_state_identity"]'''
          new = '''assert payload["current_layer"] == "data/canonical-current-state-v2.json"\nassert "\\\\" not in payload["current_layer"], "build-info repository paths must be platform-independent POSIX text"\nassert payload["canonical_state_identity"] == canonical["release"]["canonical_state_identity"]\nassert payload["canonical_state_identity_v2"] == canonical["release"]["canonical_state_identity_v2"]'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one build-info validator identity target, found {text.count(old)}')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python -m py_compile tests/canonical-authority.test.py scripts/write_build_info.py scripts/validate_build_info_current.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/canonical-authority.test.py scripts/write_build_info.py scripts/validate_build_info_current.py
          git commit -m "Bind deployment identity to canonical v2"
          git push origin HEAD:release/neutral-public-foundation-20260911
