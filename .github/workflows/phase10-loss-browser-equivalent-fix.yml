name: Apply Phase 10 loss chart-equivalent browser fix

on:
  push:
    branches:
      - ux/phase10-language-presentation-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ux/phase10-language-presentation-20260906
      - name: Retarget loss chart assertions to accessible equivalents
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/browser-public-loss-actor-batch2.js')
          text = path.read_text()
          old = """        sourceDrawers: document.querySelectorAll('[data-loss-id] details.evidence-drawer').length,\n        visualizationText: [...document.querySelectorAll('[data-loss-visualization]')].map(node => node.innerText || '').join('\\\\n')\n"""
          new = """        sourceDrawers: document.querySelectorAll('[data-loss-id] details.evidence-drawer').length,\n        physicalChartEquivalentText: document.querySelector('[data-phase5-chart-equivalent=\"loss-physical-state-record-counts\"]')?.textContent || '',\n        accountingChartEquivalentText: document.querySelector('[data-phase5-chart-equivalent=\"loss-accounting-class-record-counts\"]')?.textContent || ''\n"""
          if old not in text:
              raise SystemExit('visualization diagnostic block not found')
          text = text.replace(old, new, 1)
          old_assertions = """    assert.match(losses.visualizationText, /does not sum platform quantity or convert an unknown quantity to zero/i, 'loss visualization permits unknown-to-zero or additive quantity semantics');\n    assert.match(losses.visualizationText, /record counts[^.]*not platform quantities|record counts—not platform quantities/i, 'loss visualization is not explicitly bounded to record counts');\n"""
          new_assertions = """    assert.match(losses.physicalChartEquivalentText, /does not sum platform quantity or convert an unknown quantity to zero/i, 'physical-state numeric equivalent permits unknown-to-zero or additive quantity semantics');\n    assert.match(losses.accountingChartEquivalentText, /record counts[^.]*not platform quantities|record counts—not platform quantities/i, 'accounting-class numeric equivalent is not explicitly bounded to record counts');\n"""
          if old_assertions not in text:
              raise SystemExit('visualization assertions not found')
          text = text.replace(old_assertions, new_assertions, 1)
          path.write_text(text)
      - name: Verify browser test syntax
        run: node --check tests/browser-public-loss-actor-batch2.js
      - name: Commit chart-equivalent repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-public-loss-actor-batch2.js
          git commit -m 'Retarget Phase 10 loss browser chart assertions'
          git push origin HEAD:ux/phase10-language-presentation-20260906
